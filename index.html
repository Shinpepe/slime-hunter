<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>픽셀 슬라임 헌터</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
  body{
    background:#14161e;
    display:flex;align-items:center;justify-content:center;
    font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    color:#e8ecf8;
  }
  #wrap{position:relative;line-height:0}
  canvas{
    display:block;background:#79a35f;
    image-rendering:pixelated;image-rendering:crisp-edges;
    border:4px solid #0d0f16;box-shadow:0 8px 0 #0a0c12;
  }
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(13,15,23,.72);line-height:1.5;z-index:5;
  }
  .hidden{display:none}
  .panel{
    background:#20263a;border:4px solid #4a5578;
    box-shadow:0 6px 0 #0d0f16, inset 0 0 0 3px #141828;
    padding:20px 30px;text-align:center;max-width:86%;
  }
  h1{
    margin:0 0 4px;font-size:30px;letter-spacing:2px;color:#ffd23e;
    text-shadow:3px 3px 0 #8c3d2f;
  }
  h2{margin:0 0 8px;font-size:24px;letter-spacing:2px;color:#ff6b6b;text-shadow:3px 3px 0 #4a1420}
  .sub{font-size:13px;color:#9fb0d8;margin:0 0 14px}
  .controls{font-size:13px;color:#cfd9f4;margin:0 0 16px;text-align:left;display:inline-block}
  .controls div{margin:5px 0}
  .kbd{
    display:inline-block;background:#39415e;border:2px solid #11141f;border-bottom-width:4px;
    padding:1px 8px;border-radius:4px;font-weight:700;font-size:11px;color:#fff;
    line-height:1.5;margin:0 2px;
  }
  .btn{
    font-family:inherit;font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;
    background:#ffd23e;color:#3a2a10;border:3px solid #11141f;border-radius:4px;
    padding:9px 26px;box-shadow:0 5px 0 #11141f;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #11141f}
  .stats{font-size:14px;margin:0 0 16px;color:#cfd9f4}
  .stats b{color:#ffd23e;font-size:16px}
  .stats div{margin:4px 0}

  .btnRow{display:flex;justify-content:center;align-items:stretch;gap:12px;margin-top:14px}
  .btnIcon{
    box-sizing:border-box;padding:0;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:#39415e;border:3px solid #11141f;border-radius:4px;
    box-shadow:0 5px 0 #11141f;
  }
  .btnIcon:active{transform:translateY(4px);box-shadow:0 1px 0 #11141f}

  .btnIcon canvas{
    width:16px;height:14px;background:transparent;border:0;box-shadow:none;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }

  #touch{position:absolute;inset:0;z-index:4;pointer-events:none}
  #joy{
    position:absolute;left:16px;bottom:16px;width:96px;height:96px;border-radius:50%;
    background:rgba(20,24,40,.35);border:3px solid rgba(255,255,255,.28);
    pointer-events:auto;
  }
  #knob{
    position:absolute;left:26px;top:26px;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.45);border:3px solid rgba(255,255,255,.5);
  }
  #atkBtn{
    position:absolute;right:20px;bottom:24px;width:78px;height:78px;border-radius:50%;
    background:rgba(232,74,74,.5);border:3px solid rgba(255,255,255,.35);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:#fff;text-shadow:1px 1px 0 #501010;line-height:1;
  }
  #dashBtn{
    position:absolute;right:106px;bottom:44px;width:54px;height:54px;border-radius:50%;
    background:rgba(74,157,240,.5);border:3px solid rgba(255,255,255,.35);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12px;color:#fff;text-shadow:1px 1px 0 #103050;line-height:1;
  }

  .btnAlt{background:#4a5578;color:#fff}
  .newLine{color:#9cf7a9;font-size:13px}

  .shopPanel canvas{
    background:transparent;border:0;box-shadow:none;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  #ovShop{overflow:auto;align-items:flex-start}
  .shopPanel{width:94%;max-width:600px;margin:auto;padding:8px 14px;text-align:left}
  .shopHead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .shopTitle{font-size:19px;font-weight:800;letter-spacing:2px;color:#ffd23e;text-shadow:2px 2px 0 #8c3d2f}
  .walletBox{display:flex;align-items:center;gap:6px;background:#181c2c;border:2px solid #11141f;padding:3px 10px;font-size:14px;margin-left:auto}
  .walletBox b{color:#ffd23e}
  .walletBox canvas{width:12px;height:12px}
  #btnShopClose{font-size:12px;padding:5px 12px}
  .shopTabsRow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .shopTabs{display:flex;gap:6px}
  .shopTab{
    font-family:inherit;font-size:13px;font-weight:800;letter-spacing:1px;cursor:pointer;
    background:#4a5578;color:#fff;border:2px solid #11141f;border-radius:0;
    padding:4px 14px;box-shadow:0 3px 0 #11141f;
  }
  .shopTab:active{transform:translateY(2px);box-shadow:0 1px 0 #11141f}
  .shopTab.on{background:#ffd23e;color:#3a2a10}
  .shopCount{margin-left:auto;font-size:12px;color:#9fb0d8;flex:none}
  .shopCount b{color:#ffd23e}
  .shopLegend{display:none;gap:9px;font-size:11px;color:#9fb0d8;align-items:center;margin-left:6px}
  .shopLegend span{display:inline-flex;align-items:center;gap:4px}
  .shopBody{display:flex;flex-direction:column;gap:9px}
  .shopGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-content:start}
  .shopSlot{
    position:relative;background:#262c42;border:3px solid #4a5578;
    padding:13px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  }
  .shopSlot.gR{border-color:#4a9df0}
  .shopSlot.gE{border-color:#8b6ad1}
  .shopSlot.gU{border-color:#ffd23e}
  .shopSlot.sel{outline:2px solid #e8ecf8;outline-offset:2px}
  .shopSlot .icCv{width:44px;height:44px}
  .shopSlot.dim .icCv{opacity:.45}
  .shopSlot .nm{font-size:10px;color:#cfd9f4;text-align:center;line-height:1.25;white-space:nowrap;overflow:hidden;max-width:100%}
  .shopSlot .st{font-size:10px;font-weight:700;min-height:13px;display:flex;align-items:center;gap:3px;color:#9fb0d8}
  .gradeB{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:16px;height:15px;font-size:10px;font-weight:800;
    background:#8a94ad;color:#11141f;border:2px solid #11141f;box-shadow:0 2px 0 #11141f;
  }
  .shopSlot .gradeB{position:absolute;top:-2px;left:-2px}
  .gradeB.gR{background:#4a9df0}
  .gradeB.gE{background:#8b6ad1}
  .gradeB.gU{background:#ffd23e}
  .slotMark{position:absolute;top:2px;right:2px}
  .shopInfo{
    background:#262c42;border:3px solid #4a5578;padding:6px 10px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  #shopPv{border:3px solid #11141f;width:120px;height:132px;flex:none}
  .shopInfoTx{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
  .shopNameRow{display:flex;align-items:center;gap:6px;font-size:14px}
  .shopDesc{font-size:11px;line-height:1.5;color:#9fb0d8;text-align:center;min-height:33px}
  .shopCond{font-size:11px;min-height:15px;display:flex;align-items:center;justify-content:center;gap:4px;color:#9fb0d8;text-align:center}
  .shopCond canvas{flex:none}
  .shopAct{width:100%;max-width:280px;font-size:13px;padding:7px 8px}
  .shopAct.off{background:#2e3450;color:#8a94ad;cursor:default;box-shadow:0 2px 0 #11141f}
  .shopAct.off:active{transform:none;box-shadow:0 2px 0 #11141f}

  @media (min-width:640px){
    .shopGrid{grid-template-columns:repeat(6,minmax(0,1fr))}
    .shopInfo{flex-direction:row;align-items:center}
    .shopInfoTx{align-items:flex-start}
    .shopDesc,.shopCond{text-align:left;justify-content:flex-start}
    .shopLegend{display:flex}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="320" height="180"></canvas>

  <div class="overlay" id="ovStart">
    <div class="panel">
      <h1>픽셀 슬라임 헌터</h1>
      <p class="sub">들판을 점령한 슬라임을 물리치세요!</p>
      <p class="sub">최고 기록 <b id="startBest" style="color:#ffd23e">0</b></p>
      <div class="controls">
        <div><span class="kbd">←↑↓→</span> / <span class="kbd">WASD</span> 이동</div>
        <div><span class="kbd">SPACE</span> / <span class="kbd">Z</span> 공격</div>
        <div><span class="kbd">SHIFT</span> / <span class="kbd">X</span> 대시</div>
        <div><span class="kbd">P</span> 일시정지 &nbsp; <span class="kbd">M</span> 소리 켜기/끄기</div>
      </div>
      <div class="btnRow">
        <button class="btn" id="btnStart">게임 시작</button>
        <button class="btn btnAlt" id="btnShop">꾸미기</button>
        <button class="btnIcon" id="btnSound" title="소리 켜기/끄기" aria-label="소리 켜기/끄기"><canvas id="sndCv" width="8" height="7"></canvas></button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="ovStage">
    <div class="panel">
      <h2 id="stgTitle" style="color:#ffd76e;text-shadow:3px 3px 0 #7a4d12">STAGE 1 클리어!</h2>
      <div class="stats">
        <div>남은 하트 보너스 <b id="stgBonus">+0</b></div>
        <div>다음 스테이지 <b id="stgNext">사막</b></div>
        <div id="stgNew" class="newLine hidden"></div>
      </div>
      <button class="btn" id="btnStageNext">계속 (Enter)</button>
    </div>
  </div>

  <div class="overlay hidden" id="ovShop">
    <div class="panel shopPanel">
      <div class="shopHead">
        <span class="shopTitle">상점</span>
        <span class="walletBox"><canvas id="shopCoin" width="12" height="12"></canvas><b id="shopWallet">0</b></span>
        <button class="btn btnAlt" id="btnShopClose">돌아가기</button>
      </div>
      <div class="shopTabsRow">
        <div class="shopTabs" id="shopTabs"></div>
        <div class="shopLegend">
          <span><span class="gradeB">C</span> 일반</span>
          <span><span class="gradeB gR">R</span> 레어</span>
          <span><span class="gradeB gE">E</span> 에픽</span>
          <span><span class="gradeB gU">U</span> 유니크</span>
        </div>
        <span class="shopCount" id="shopCount"></span>
      </div>
      <div class="shopBody">
        <div class="shopGrid" id="shopGrid"></div>
        <div class="shopInfo">
          <canvas id="shopPv" width="120" height="132"></canvas>
          <div class="shopInfoTx">
            <div class="shopNameRow"><span class="gradeB" id="shopBadge">C</span><b id="shopName"></b></div>
            <div class="shopDesc" id="shopDesc"></div>
            <div class="shopCond" id="shopCond"></div>
            <button class="btn shopAct" id="shopAct">착용중</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="ovOver">
    <div class="panel">
      <h2>게임 오버</h2>
      <div class="stats">
        <div>점수 <b id="stScore">0</b></div>
        <div>최고 기록 <b id="stBest">0</b></div>
        <div>처치한 몬스터 <b id="stKills">0</b></div>
        <div>도달 지점 <b id="stWave">1-1</b></div>
        <div>획득 골드 <b id="stGold" style="color:#9cf7a9">+0</b></div>
        <div id="stNew" class="newLine hidden"></div>
      </div>
      <div class="btnRow">
        <button class="btn" id="btnRetry">다시 시작 (R)</button>
        <button class="btn btnAlt" id="btnShop2">꾸미기</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="ovPause">
    <div class="panel">
      <h2 style="color:#9fd0ff;text-shadow:3px 3px 0 #1e3a5c">일시정지</h2>
      <button class="btn" id="btnResume">계속하기</button>
    </div>
  </div>

  <div id="touch" class="hidden">
    <div id="joy"><div id="knob"></div></div>
    <div id="dashBtn">대시</div>
    <div id="atkBtn">공격</div>
  </div>
</div>

<script>
'use strict';

const W = 320, H = 180;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const C = {
  out:  '#22252e',
  steel:'#5a6988', steelL:'#9db0cc',
  skin: '#ffcf9e',
  blue: '#3b6ee0', blueD:'#2a4bb8', pants:'#3a4466',
  brown:'#8a5a34', brownD:'#66401f',
  gold: '#ffd23e',
  red:  '#e84a4a',
  white:'#f8f8f8',
};

const MOB_TYPES = {
  green:{kind:'slime', body:'#3ecf5e', lite:'#9cf7a9', dark:'#27994a', hp:2, score:10,  rest:0.55, air:0.40, spd:62, kbMul:1},
  red:  {kind:'slime', body:'#f05555', lite:'#ffb0b0', dark:'#b02f2f', hp:3, score:25,  rest:0.38, air:0.38, spd:80, kbMul:0.85},
  gold: {kind:'slime', ess:'gold', body:'#ffc93e', lite:'#ffe9a8', dark:'#c4891c', hp:5, score:60,  rest:0.30, air:0.36, spd:92, kbMul:0.55},
  sand: {kind:'slime', ranged:true, ess:'sand', body:'#e3c076', lite:'#f6e6b2', dark:'#a9823f', hp:2, score:30, rest:0.50, air:0.42, spd:70, spitCd:2.3, kbMul:1},
  frost:{kind:'slime', chill:true, ess:'frost', body:'#7fd6ea', lite:'#d6f6fd', dark:'#3f93ad', hp:2, score:20, rest:0.50, air:0.40, spd:66, kbMul:1},
  bomb: {kind:'slime', bomb:true, ess:'bomb', body:'#565064', lite:'#8a839c', dark:'#332e40', hp:2, score:35, rest:0.42, air:0.38, spd:76, kbMul:0.9},
  bat:  {kind:'bat',   body:'#8b6ad1', lite:'#c9b3f2', dark:'#5f47a8', hp:1, score:15,  spd:44, kbMul:1.15},
};

const ESSENCES={
  frost:{name:'FROST', col:'#7fd6ea', lite:'#d6f6fd', rgb:'127,214,234'},
  bomb: {name:'BOMB',  col:'#ff9b3e', lite:'#ffd23e', rgb:'255,155,62'},
  sand: {name:'SAND',  col:'#e3c076', lite:'#f6e6b2', rgb:'227,192,118'},
  gold: {name:'GOLD',  col:'#ffd23e', lite:'#ffe9a8', rgb:'255,210,62'},
};
const ESSENCE_TIME=7;

const BOMB_R_PLAYER=26, BOMB_R_MOB=30;

const STAGES=[
 {name:'초원', ename:'MEADOW',   obst:null,     base:'#79a35f', mot:['#83ad68','#6f9755'], tuft:'#5c8548', deco:'flower',  patch:['#c2a36b','#a8894f'], rock:['#8b95a8','#b8c2d4','#5c6577'], borderA:'#3f6d3a', borderB:'#4e8347', borderD:'#2c4d29', topA:'#2e4d33', topB:['#3a5f40','#264229'], topLine:'#1e3522'},
 {name:'사막', ename:'DESERT',   obst:'cactus', base:'#dcb97e', mot:['#e4c48c','#cfa868'], tuft:'#a8874e', deco:'stone',   patch:['#c49a5e','#a87f45'], rock:['#9a8468','#c4b096','#6e5c44'], borderA:'#b08d52', borderB:'#c9a468', borderD:'#8a6b3a', topA:'#8a6b3f', topB:['#9c7c4c','#755932'], topLine:'#5e4626'},
 {name:'설원', ename:'SNOW FIELD', obst:'ice',  base:'#dfe9f2', mot:['#eef5fb','#cbd9e6'], tuft:'#a4b8c8', deco:'crystal', patch:['#c2d2e0','#a8bccf'], rock:['#8b98ab','#c2cdd9','#5f6b7c'], borderA:'#a9bfd2', borderB:'#c4d6e6', borderD:'#7f96ac', topA:'#5a7089', topB:['#68809a','#4a5f76'], topLine:'#3a4c60'},
 {name:'화산', ename:'VOLCANO',  obst:'lava',   base:'#4e4449', mot:['#5a4f55','#423940'], tuft:'#6e3a2a', deco:'ember',   patch:['#3a3136','#2e272b'], rock:['#6a5f66','#8d8290','#3e363d'], borderA:'#3a3138', borderB:'#4a4048', borderD:'#26212a', topA:'#2c2530', topB:['#382f3c','#201b26'], topLine:'#161218'},
];
const WAVES_PER_STAGE=5, MOB_CAP=9;

const BX0=12, BX1=308, BY0=34, BY1=168;

let state = 'start';
let score=0, best=0, kills=0, wave=0;
try{ best=(+localStorage.getItem('psh_best'))||0; }catch(e){}
function saveBest(){ try{ localStorage.setItem('psh_best', best); }catch(e){} }
let nextWaveT=-1, banner=null, shake=0, gameT=0, deathT=0;
let mobs=[], parts=[], pops=[], spawnQueue=[], spawnT=0;
let shots=[], ghosts=[], hitstop=0, wantDash=false;
let rings=[];
let stageIdx=0, ngPlus=0, obstacles=[];
let essence=null, lastBoomSwing=-1;
let combo=0, comboT=0, comboPop=0;
const COMBO_WINDOW=3.0;
let muted=false;
try{ muted=localStorage.getItem('psh_muted')==='1'; }catch(e){}

const player = {
  x:W/2, y:H/2+18, dir:'down', moving:false, animT:0,
  hp:5, maxHp:5, inv:0, atkT:0, atkCd:0, swingId:0, kbx:0, kby:0, dead:false,
  dashT:0, dashCd:0, dashGrace:0, dashVx:0, dashVy:0,
  mvx:0, mvy:0, slowT:0
};
const P_SPEED=78, ATK_TIME=0.24, ATK_CD=0.42;
const DASH_TIME=0.16, DASH_CD=1.0, DASH_SPD=250, DASH_GRACE=0.10;

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a,b)=>a+Math.random()*(b-a);
const overlap=(a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

const GRADE_COL={C:'#8a94ad', R:'#4a9df0', E:'#8b6ad1', U:'#ffd23e'};

const LOCK_IC=['..11..','.1..1.','.1..1.','111111','111111','11..11','111111'];
const QMARK_IC=['.111.','1...1','....1','..11.','..1..','.....','..1..'];
const COIN_IC=['.####.','#WGGL#','#GWGG#','#GGGG#','#LGGW#','.####.'];
const COIN_COLS={'#':'#8c5a1c','G':'#ffd23e','W':'#ffe9a8','L':'#e09a28'};

let SAVE={v:1, wallet:0, equip:{helm:'steel', outfit:'blue', weapon:'sword'},
          owned:['steel','blue','sword'], seen:[],
          rec:{loop:0, cactus:0, sClear:[0,0,0,0], anyNoHit:0, fullNoHit:0, hi20:0}};
function saveShop(){ try{ localStorage.setItem('psh_save', JSON.stringify(SAVE)); }catch(e){} }
let runStageHit=false, runLoopHit=false;
let newUnlocks=[];
let shopOpen=false, shopFrom=null, shopCat='helm', shopSel='steel';
let shopSw=0, shopSwCd=0.8;

const HELM_PARTS={
  steel(p,x,y){
    p(x-4,y-23,8,2,C.steel); p(x-5,y-21,10,3,C.steel); p(x-5,y-19,10,1,C.steelL);
    p(x-1,y-26,2,3,C.red); p(x-1,y-27,2,1,'#ff8f8f');
  },
  leather(p,x,y){
    p(x-3,y-24,6,4,C.brown); p(x-3,y-24,6,1,'#a8713f');
    p(x-6,y-20,12,2,C.brown); p(x-6,y-19,12,1,C.brownD);
  },
  cotton(p,x,y){
    p(x-4,y-23,8,2,'#ece6d8'); p(x-5,y-21,10,3,'#ece6d8'); p(x-4,y-23,8,1,'#faf6ec');
    p(x-5,y-19,10,1,'#c8c0ac');
    p(x+3,y-18,3,2,'#ece6d8'); p(x+4,y-16,2,3,'#d8d0bc'); p(x+4,y-13,2,1,'#c8c0ac');
  },
  horn(p,x,y){

function segRects(hx,hy,A,list){
  const px=Math.cos(A+Math.PI/2), py=Math.sin(A+Math.PI/2), R=[];
  for(const e of list){
    const o=e.o||0;
    R.push([hx+Math.cos(A)*e.i+px*o-1, hy+Math.sin(A)*e.i+py*o-1, e.s, e.s, e.c]);
  }
  return R;
}

(function loadShopSave(){
  try{
    const raw=localStorage.getItem('psh_save');
    if(!raw) return;
    const d=JSON.parse(raw);
    if(d && typeof d==='object'){
      SAVE.wallet=Math.max(0, (+d.wallet)||0);
      if(Array.isArray(d.owned)) SAVE.owned=d.owned.filter(id=>catalogIds('helm').includes(id)||catalogIds('outfit').includes(id)||catalogIds('weapon').includes(id));
      for(const b of ['steel','blue','sword']) if(!SAVE.owned.includes(b)) SAVE.owned.push(b);
      if(d.equip && typeof d.equip==='object'){
        for(const cat of ['helm','outfit','weapon']){
          const id=d.equip[cat];
          if(catalogIds(cat).includes(id) && SAVE.owned.includes(id)) SAVE.equip[cat]=id;
        }
      }
      if(Array.isArray(d.seen)) SAVE.seen=d.seen.filter(s=>typeof s==='string');
      if(d.rec && typeof d.rec==='object'){
        SAVE.rec.loop=Math.max(0,(+d.rec.loop)||0);
        SAVE.rec.cactus=Math.max(0,(+d.rec.cactus)||0);
        if(Array.isArray(d.rec.sClear)) for(let i=0;i<4;i++) SAVE.rec.sClear[i]=d.rec.sClear[i]?1:0;
        SAVE.rec.anyNoHit=d.rec.anyNoHit?1:0;
        SAVE.rec.fullNoHit=d.rec.fullNoHit?1:0;
        SAVE.rec.hi20=d.rec.hi20?1:0;
      }
    }
  }catch(e){}
  if(best>=20000) SAVE.rec.hi20=1;
})();

function checkUnlocks(){
  if(score>=20000) SAVE.rec.hi20=1;
  let ch=false;
  for(const cat in SHOP_CATALOG) for(const it of SHOP_CATALOG[cat]){
    if(it.ach && it.ach.ok() && !SAVE.owned.includes(it.id)){
      SAVE.owned.push(it.id); newUnlocks.push(it.name+' 획득'); ch=true;
    } else if(it.cond && it.cond.ok() && !SAVE.seen.includes(it.id)){
      SAVE.seen.push(it.id); newUnlocks.push(it.name+' 해금'); ch=true;
    }
  }

}

let actx=null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function beep(freq, dur, type, vol, slideTo){
  if(muted || !actx) return;
  const t0=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
  g.gain.setValueAtTime(vol||0.07, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}

function bgmTone(freq,t,dur,type,vol){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(bgmGain);
  o.start(t); o.stop(t+dur+0.02);
}
function bgmKick(t){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(45,t+0.1);
  g.gain.setValueAtTime(0.10,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.11);
  o.connect(g); g.connect(bgmGain);
  o.start(t); o.stop(t+0.13);
}
function bgmHat(t,vol){
  const s=actx.createBufferSource(); s.buffer=noiseBuf;
  const g=actx.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.03);
  s.connect(g); g.connect(bgmGain);
  s.start(t); s.stop(t+0.05);
}
function updBGM(){
  if(!actx || state==='start' || state==='over'){ bgm.next=0; return; }
  if(!bgmGain){
    bgmGain=actx.createGain();
    bgmGain.gain.value = muted?0:1;
    bgmGain.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,(actx.sampleRate*0.05)|0,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  if(bgm.sIdx!==stageIdx){ bgm.sIdx=stageIdx; bgm.step=0; }
  const def=BGM_DEFS[stageIdx]||BGM_DEFS[0];
  const spb=60/def.bpm/4;
  if(bgm.next===0) bgm.next=actx.currentTime+0.06;
  else if(bgm.next < actx.currentTime){

    bgm.next=actx.currentTime+0.06;
  }
  while(bgm.next < actx.currentTime+0.16){
    const st=bgm.step, t=bgm.next;
    const sec=(st>>5)&3;
    if(def.kick.includes(st%8)) bgmKick(t);
    if(def.hatVol>0 && st%def.hatMod===def.hatOff) bgmHat(t,def.hatVol);
    const b=def.bass[st%32]; if(b!==null) bgmTone(def.root*Math.pow(2,b/12), t, spb*1.8, def.bassType, def.bassVol);
    if(def.arp){ const arr=(sec===2&&def.arpB)?def.arpB:def.arp; const a=arr[st%32]; if(a!==null) bgmTone(def.root*Math.pow(2,a/12), t, spb*1.1, 'triangle', def.arpVol||0.018); }
    const l=((sec===2&&def.leadB)?def.leadB:def.lead)[st%32]; if(l!==null) bgmTone(def.root*Math.pow(2,l/12), t, spb*1.5, def.leadType, def.leadVol);
    bgm.next+=spb; bgm.step=(bgm.step+1)%128;
  }
}

function keyName(e){
  const c=e.code;
  if(!c) return (e.key||'').toLowerCase();
  if(c.startsWith('Key')) return c.slice(3).toLowerCase();
  if(c.startsWith('Arrow')) return c.toLowerCase();
  if(c.startsWith('Shift')) return 'shift';
  if(c==='Space') return ' ';
  if(c==='NumpadEnter') return 'enter';
  return c.toLowerCase();
}
window.addEventListener('keydown', e=>{

  keys[key]=true;

  if(shopOpen){
    if(key==='escape'||key==='enter') closeShop();
    return;

  if((key==='shift'||key==='x') && !e.repeat && state==='play') wantDash=true;
  if(state==='start' && (key==='enter'||key===' ')) startGame();
  else if(state==='over' && (key==='enter'||key==='r')) startGame();

});

const OBST_APPEAR=0.4;
function obstRad(o){ return o.kind==='cactus' ? 7 : Math.max(o.w,o.h)/2; }
function obstRect(o, pad){
  pad=pad||0;
  if(o.kind==='cactus') return {x:o.x-4-pad, y:o.y-10-pad, w:8+pad*2, h:10+pad*2};
  return {x:o.x-o.w/2-pad, y:o.y-o.h/2-pad, w:o.w+pad*2, h:o.h+pad*2};
}
function ptIn(r, x, y){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
function onIceAt(x,y){
  for(const o of obstacles) if(o.kind==='ice' && ptIn(obstRect(o,-2),x,y)) return true;
  return false;
}
function hazardAtPoint(x,y,pad){
  for(const o of obstacles){
    if(o.kind==='ice') continue;
    if(ptIn(obstRect(o,pad),x,y)) return true;
  }
  return false;
}

function clearObstacles(withFx){
  if(withFx) for(const o of obstacles){
    const cols = o.kind==='cactus' ? ['#4e9c52','#7cc47e'] :
                 o.kind==='ice' ? ['#d6f2ff','#a8d8ec'] : ['#ff7b2e','#5a3020'];
    burst(o.x, o.y-3, 6, cols, 40, 0.35, 60);
  }
  obstacles=[];
}

function placeObstacles(){
  clearObstacles(false);
  const kind=STAGES[stageIdx].obst;
  if(!kind) return;
  let count, mkSize;
  if(kind==='cactus'){ count=3+((Math.random()*3)|0); mkSize=()=>({w:8,h:10}); }
  else if(kind==='ice'){ count=3+((Math.random()*2)|0); mkSize=()=>({w:(rnd(46,66))|0,h:(rnd(30,42))|0}); }
  else { count=2+((Math.random()*2)|0); mkSize=()=>({w:(rnd(36,48))|0,h:(rnd(24,32))|0}); }
  const field=(BX1-BX0)*(BY1-BY0);
  const areaCap = kind==='ice' ? field*0.25 : field*0.15;
  let area=0;
  for(let n=0;n<count;n++){
    const sz=mkSize();
    if(area+sz.w*sz.h>areaCap) break;
    let placed=false;
    for(let t=0;t<60 && !placed;t++){
      const hw=sz.w/2, hh=sz.h/2;
      const cx=rnd(BX0+16+hw, BX1-16-hw);
      const cy=rnd(BY0+12+hh, BY1-10-hh);
      if(Math.hypot(cx-player.x, cy-player.y)<45+Math.max(hw,hh)) continue;
      let ok=true;
      for(const o of obstacles){
        const need=obstRad({kind,w:sz.w,h:sz.h}) + obstRad(o) + 26;
        if(Math.hypot(cx-o.x, cy-o.y) < Math.max(40,need)){ ok=false; break; }
      }
      if(!ok) continue;
      obstacles.push({kind, x:cx, y:cy, w:sz.w, h:sz.h, uses:3, t:0, seed:Math.random()*10});
      area+=sz.w*sz.h;
      placed=true;
    }
  }
}

function drawCactus(o){
  const ap=clamp(o.t/OBST_APPEAR,0,1);
  const x=Math.round(o.x), y=Math.round(o.y);
  shadow(x, y, 8);
  const h=Math.round(11*ap);
  if(h<2) return;
  pr(x-2, y-h, 4, h, '#4e9c52');
  pr(x-2, y-h, 2, h, '#7cc47e');
  if(ap>0.8){
    pr(x-6, y-h+3, 4, 2, '#4e9c52'); pr(x-6, y-h+1, 2, 4, '#4e9c52');
    pr(x+2, y-h+4, 4, 2, '#4e9c52'); pr(x+4, y-h+2, 2, 4, '#4e9c52');
  }
  flushSprite(false);
  if(ap>0.8){
    ctx.fillStyle='#fff8d8';
    ctx.fillRect(x-3,y-h+2,1,1); ctx.fillRect(x+2,y-h+5,1,1);
    ctx.fillRect(x-1,y-h-1,1,1); ctx.fillRect(x+1,y-4,1,1);
    ctx.fillStyle='#ff9ecb'; ctx.fillRect(x-1,y-h-2,2,1);
    if(o.uses<3){ ctx.fillStyle='#2f6b38'; ctx.fillRect(x-1,y-((h*0.6)|0),2,1); }

  }
}

function hurtPlayer(src, dmg){
  player.hp-=(dmg||1); player.inv=1.25; shake=5; sHurt();
  combo=0; comboT=0;
  runStageHit=true; runLoopHit=true;
  hitstop=Math.max(hitstop, 0.08);
  if(src.type && src.type.chill){ player.slowT=2; }
  const a=Math.atan2(player.y-src.y, player.x-src.x);
  player.kbx=Math.cos(a)*140; player.kby=Math.sin(a)*140;
  burst(player.x, player.y-8, 8, ['#e84a4a','#ffcf9e'], 70, 0.45, 90);
  if(player.hp<=0){
    player.hp=0;
    player.dead=true; deathT=1.3; shake=8; sDie();
    burst(player.x, player.y-9, 22, [C.blue,C.steel,C.skin,'#e84a4a'], 95, 0.8, 130);
  }
}

function updPlayer(dt){
  if(player.dead) return;
  let ix=(k('arrowright')||k('d')?1:0)-(k('arrowleft')||k('a')?1:0);
  let iy=(k('arrowdown')||k('s')?1:0)-(k('arrowup')||k('w')?1:0);
  ix+=joyVec.x; iy+=joyVec.y;
  const len=Math.hypot(ix,iy);
  if(len>1){ ix/=len; iy/=len; }
  const attacking=player.atkT>0;

  if(player.dashCd>0) player.dashCd-=dt;
  if(wantDash && player.dashCd<=0 && player.dashT<=0){
    let dx=ix, dy=iy;
    const l=Math.hypot(dx,dy);
    if(l<0.2){ const v=DIRV[player.dir]; dx=v[0]; dy=v[1]; }
    else { dx/=l; dy/=l; }
    player.dashT=DASH_TIME; player.dashCd=DASH_CD;
    player.dashVx=dx*DASH_SPD; player.dashVy=dy*DASH_SPD;
    burst(player.x, player.y-2, 6, ['#c8e6ff','#e8f4ff'], 45, 0.3, 40);
    sDash();
  }
  wantDash=false;

  if(player.dashT>0){

    player.dashT-=dt;
    player.x+=player.dashVx*dt; player.y+=player.dashVy*dt;
    player.mvx=player.dashVx*0.3; player.mvy=player.dashVy*0.3;
    ghosts.push({x:player.x, y:player.y, t:0.16, max:0.16});
    if(player.dashT<=0) player.dashGrace=DASH_GRACE;
    player.moving=true; player.animT+=dt;
  } else {

    if(player.slowT>0) player.slowT-=dt;
    const spd=P_SPEED*(attacking?0.4:1)*(player.slowT>0?0.7:1);
    const ice=onIceAt(player.x, player.y);
    const f = ice ? Math.min(1, 2.6*dt) : 1;
    player.mvx+=(ix*spd-player.mvx)*f;
    player.mvy+=(iy*spd-player.mvy)*f;
    player.x+=player.mvx*dt; player.y+=player.mvy*dt;
    player.moving = len>0.18 || Math.hypot(player.mvx,player.mvy)>10;

    if(ice && len<0.18 && Math.hypot(player.mvx,player.mvy)>26 && Math.random()<dt*22)
      parts.push({x:player.x+rnd(-3,3), y:player.y-1, vx:-player.mvx*0.06, vy:-6, g:0, life:0.3, max:0.3, col:'#e8f8ff', s:1});
    if(player.moving) player.animT+=dt; else player.animT=0;
    if(len>0.18 && !attacking){
      if(Math.abs(ix)>Math.abs(iy)) player.dir=ix>0?'right':'left';
      else player.dir=iy>0?'down':'up';
    }

    if(player.slowT>0 && Math.random()<dt*8)
      parts.push({x:player.x+rnd(-5,5), y:player.y-rnd(8,20), vx:rnd(-4,4), vy:8,
        g:0, life:0.4, max:0.4, col:'#d6f6fd', s:1});
  }
  if(player.dashGrace>0) player.dashGrace-=dt;

  if(essence && Math.random()<dt*7)
    parts.push({x:player.x+rnd(-6,6), y:player.y-rnd(6,18), vx:rnd(-3,3), vy:-10, g:0, life:0.35, max:0.35, col:ESSENCES[essence.kind].col, s:1});

  if(essence && essence.kind==='frost' && player.atkT>0 && Math.random()<dt*28){
    const fv=DIRV[player.dir];
    parts.push({x:player.x+fv[0]*10+rnd(-7,7), y:player.y-9+fv[1]*8+rnd(-7,7), vx:rnd(-6,6), vy:rnd(2,10),
      g:0, life:0.3, max:0.3, col:Math.random()<0.5?'#d6f6fd':'#7fd6ea', s:1});
  }

  player.x+=player.kbx*dt; player.y+=player.kby*dt;
  const fr = onIceAt(player.x,player.y) ? 0.08 : 0.0008;
  const d=Math.pow(fr,dt); player.kbx*=d; player.kby*=d;
  player.x=clamp(player.x,BX0,BX1); player.y=clamp(player.y,BY0,BY1);

  if(player.inv>0) player.inv-=dt;
  if(player.atkCd>0) player.atkCd-=dt;

  if(player.atkT>0){
    player.atkT-=dt;
    const p=1-Math.max(0,player.atkT)/ATK_TIME;
    if(p>0.15 && p<0.85){
      const hb=swingRect();
      for(const m of mobs){
        if(m.spawnT>0 || m.deadFlag || m.fusing || m.lastSwing===player.swingId) continue;
        if(overlap(hb, mobRect(m))){ m.lastSwing=player.swingId; hitMob(m); }
      }

      for(const sh of shots){
        if(sh.dead || sh.own) continue;
        if(overlap(hb, {x:sh.x-2, y:sh.y-2, w:4, h:4})){
          sh.dead=true; sPop(); hitstop=Math.max(hitstop,0.03);
          burst(sh.x, sh.y, 5, [sh.lite||'#b0d8ff','#ffffff'], 55, 0.3, 0);
        }
      }
    }
  }
  if(k(' ')||k('z')||touchAtk) tryAttack();

  if(player.inv<=0 && player.dashT<=0 && player.dashGrace<=0){
    const prc={x:player.x-4, y:player.y-12, w:8, h:12};
    for(const m of mobs){
      if(m.spawnT>0 || m.deadFlag || m.fusing) continue;
      if(overlap(prc, mobRect(m))){ hurtPlayer(m); break; }
    }
  }

  if(state==='play' && player.dashT<=0 && player.dashGrace<=0 && !player.dead){
    const prc2={x:player.x-4, y:player.y-12, w:8, h:12};
    for(const o of obstacles){
      if(o.t<OBST_APPEAR) continue;
      if(o.kind==='cactus'){
        if(player.inv<=0 && overlap(prc2, obstRect(o,0))) hurtPlayer(o);
      } else if(o.kind==='lava'){
        if(ptIn(obstRect(o,-3), player.x, player.y)){

          const r=obstRect(o,0);
          const dl=player.x-r.x, dr=(r.x+r.w)-player.x, du=player.y-r.y, dd=(r.y+r.h)-player.y;
          const mn=Math.min(dl,dr,du,dd);
          let ex=0, ey=0;
          if(mn===dl){ player.x=r.x-7; ex=-1; }
          else if(mn===dr){ player.x=r.x+r.w+7; ex=1; }
          else if(mn===du){ player.y=r.y-7; ey=-1; }
          else { player.y=r.y+r.h+7; ey=1; }
          player.x=clamp(player.x,BX0,BX1); player.y=clamp(player.y,BY0,BY1);
          player.kbx=ex*190; player.kby=ey*190;
          burst(player.x, player.y-4, 8, ['#ff7b2e','#ffd23e'], 60, 0.4, 80);
          if(player.inv<=0) hurtPlayer({x:o.x,y:o.y}, 2);
          break;
        }
      }
    }
  }

  const OCp=OUTFITS[SAVE.equip.outfit]||OUTFITS.blue;
  if(OCp.sparkle && Math.random()<dt*4){
    parts.push({x:player.x+rnd(-5,5), y:player.y-rnd(5,13), vx:rnd(-3,3), vy:-7, g:0,
                life:0.3, max:0.3, col:Math.random()<0.5?'#fff3c8':'#ffd23e', s:1});
  }
  if(OCp.ember && (player.moving||player.dashT>0) && Math.random()<dt*5){
    parts.push({x:player.x+rnd(-4,4), y:player.y-rnd(0,4), vx:rnd(-6,6), vy:rnd(-16,-9), g:-12,
                life:0.35, max:0.35, col:Math.random()<0.5?'#ff7b2e':'#ffd23e', s:1});
  }
}

function drawSword(){
  if(player.atkT<=0) return;
  const p=1-Math.max(0,player.atkT)/ATK_TIME;
  const base={right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2}[player.dir];
  const start=base-1.15, end=base+1.15;
  const ease=p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
  const A=start+(end-start)*ease;

  const dv=DIRV[player.dir];
  const hx=player.x+dv[0]*5, hy=player.y-9+dv[1]*4;

  const Wd=WEAPONS[SAVE.equip.weapon]||WEAPONS.sword;
  const E=essence && ESSENCES[essence.kind];
  const eOn=E && (essence.t>1.5 || Math.floor(gameT*10)%2===0);
  const gCol=eOn?E.col:Wd.g, tCol=eOn?E.lite:Wd.t, trailRGB=eOn?E.rgb:(Wd.trail||'255,255,255');

  for(let i=0;i<=7;i++){
    const ta=start+(A-start)*(i/7);
    ctx.fillStyle='rgba('+trailRGB+','+(0.08+0.40*(i/7))+')';
    ctx.fillRect(Math.round(hx+Math.cos(ta)*16)-1, Math.round(hy+Math.sin(ta)*16)-1, 2,2);
    ctx.fillRect(Math.round(hx+Math.cos(ta)*12)-1, Math.round(hy+Math.sin(ta)*12)-1, 2,2);
    ctx.fillRect(Math.round(hx+Math.cos(ta)*8)-1,  Math.round(hy+Math.sin(ta)*8)-1,  2,2);
  }

  for(const r of Wd.build(hx,hy,A,gCol,tCol)) pr(r[0],r[1],r[2],r[3],r[4]);

  const OCs=OUTFITS[SAVE.equip.outfit]||OUTFITS.blue;
  pr(hx-1, hy-1, 3, 3, OCs.dark);
  pr(hx+Math.cos(A)*2.5-1, hy+Math.sin(A)*2.5-1, 3, 3, C.skin);
  flushSprite(false);
}

function drawPlayer(){
  if(player.dead) return;
  const blink = player.inv>0 && (Math.floor(gameT*16)%2===0);
  shadow(player.x, player.y, 11);
  if(blink) return;

  const fx=Math.round(player.x), fy=Math.round(player.y);
  const frame=player.moving ? Math.floor(player.animT*8)%4 : 0;
  const legF=[0,1,0,2][frame];
  const bob = legF ? -1 : 0;
  const dv=DIRV[player.dir];
  const lunge = player.atkT>0 ? 2 : 0;
  const ox=dv[0]*lunge, oy=dv[1]*lunge;
  const x=fx+ox, yb=fy+Math.round(oy*0.5);

  if(player.dir==='up') drawSword();

  const lUp = legF===1?1:0, rUp = legF===2?1:0;
  pr(x-4, yb-5-lUp, 3, 3, C.pants);
  pr(x-4, yb-2-lUp, 4, 2, C.brown);
  pr(x+1, yb-5-rUp, 3, 3, C.pants);
  pr(x,   yb-2-rUp, 4, 2, C.brown);

  const OC=OUTFITS[SAVE.equip.outfit]||OUTFITS.blue;
  pr(x-5, yb-13+bob, 10, 8, OC.body);
  pr(x-4, yb-12+bob, 8, 3, OC.plate);
  pr(x-4, yb-12+bob, 8, 1, OC.plateL);
  pr(x-5, yb-6+bob, 10, 1, C.brownD);
  pr(x-1, yb-6+bob, 2, 1, OC.buckle);
  if(OC.deco) OC.deco((dx,dy,dw,dh,dc)=>pr(dx,dy+bob,dw,dh,dc), x, yb);

  if(player.atkT<=0){
    const aoff = legF===1?1 : legF===2?-1 : 0;
    pr(x-7, yb-12+bob+aoff, 2, 4, OC.dark); pr(x-7, yb-8+bob+aoff, 2, 2, C.skin);
    pr(x+5, yb-12+bob-aoff, 2, 4, OC.dark); pr(x+5, yb-8+bob-aoff, 2, 2, C.skin);
  }

  if(player.dir==='up'){
    const HB=HELM_BACK[SAVE.equip.helm]||HELM_BACK.steel;
    pr(x-4, yb-18+bob, 8, 5, HB[0]);
    pr(x-4, yb-16+bob, 8, 1, HB[1]);
  } else {
    pr(x-4, yb-18+bob, 8, 5, C.skin);
  }

  (HELM_PARTS[SAVE.equip.helm]||HELM_PARTS.steel)((hx2,hy2,hw2,hh2,hc2)=>pr(hx2,hy2+bob,hw2,hh2,hc2), x, yb);
  flushSprite(false);

  if(player.dir!=='up'){
    ctx.fillStyle='#26283a';
    if(player.dir==='down'){ ctx.fillRect(x-3,yb-17+bob,1,2); ctx.fillRect(x+2,yb-17+bob,1,2); }
    else if(player.dir==='left'){ ctx.fillRect(x-4,yb-17+bob,1,2); ctx.fillRect(x+0,yb-17+bob,1,2); }
    else { ctx.fillRect(x-1,yb-17+bob,1,2); ctx.fillRect(x+3,yb-17+bob,1,2); }
  }

  if(SAVE.equip.helm==='slimehat' && player.dir!=='up'){
    const hd = player.dir==='left' ? -1 : player.dir==='right' ? 1 : 0;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(x-2+hd, yb-24+bob, 1, 2); ctx.fillRect(x+1+hd, yb-24+bob, 1, 2);
    ctx.fillStyle='#173322';
    ctx.fillRect(x-2+hd, yb-23+bob, 1, 1); ctx.fillRect(x+1+hd, yb-23+bob, 1, 1);
  }

  if(player.dir!=='up') drawSword();
}

function mobRect(m){
  if(m.type.kind==='bat') return {x:m.x-4, y:m.y-13, w:8, h:9};
  return {x:m.x-5, y:m.y-8, w:10, h:8};
}

function spawnMob(typeName){
  const type=MOB_TYPES[typeName];
  let x,y;
  for(let i=0;i<12;i++){
    const edge=(Math.random()*4)|0;
    if(edge===0){ x=rnd(BX0,BX1); y=BY0+rnd(0,8); }
    else if(edge===1){ x=rnd(BX0,BX1); y=BY1-rnd(0,8); }
    else if(edge===2){ x=BX0+rnd(0,8); y=rnd(BY0,BY1); }
    else { x=BX1-rnd(0,8); y=rnd(BY0,BY1); }
    if(Math.hypot(x-player.x, y-player.y)>55) break;
  }
  mobs.push({
    type, hp:type.hp + (type.kind==='slime' ? Math.min(2,ngPlus) : 0),
    x, y, z:0, t:rnd(0,3),
    spdMul:1 + stageIdx*0.05 + ngPlus*0.1,
    phase:'rest', pt:rnd(0.2,0.7), vx:0, vy:0,
    kbx:0, kby:0, flash:0, spawnT:0.6, lastSwing:-1,
    squishW:1, squishH:1, flap:0, spit:rnd(1.2,2.2), kbRes:0, hitRecent:0, hazCd:0, slowT:0
  });
}

function hitMob(m){
  if(m.fusing || m.deadFlag) return;
  m.hp--; m.flash=0.12; sHit();
  hitstop=Math.max(hitstop, 0.04);

  if(m.hitRecent>0) m.kbRes=Math.min(m.kbRes+1, 4);
  else m.kbRes=0;
  m.hitRecent=0.9;
  const kb=115*(m.type.kbMul||1)/(1+m.kbRes*1.1);
  const a=Math.atan2(m.y-player.y, m.x-player.x);
  m.kbx+=Math.cos(a)*kb; m.kby+=Math.sin(a)*kb;
  comboKeep();
  burst(m.x, m.y-6, 5, ['#ffffff', m.type.lite], 60, 0.3, 0);

  if(essence){
    if(essence.kind==='frost'){
      m.slowT=2.5; sFrost();
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2 + 0.26;
        parts.push({x:m.x+Math.cos(a)*2, y:m.y-6+Math.sin(a)*2, vx:Math.cos(a)*70, vy:Math.sin(a)*70,
          g:0, life:0.22, max:0.22, col:i%2?'#d6f6fd':'#7fd6ea', s:i%2?1:2});
      }
      burst(m.x, m.y-6, 5, ['#ffffff','#d6f6fd'], 45, 0.3, 10);
    }
    else if(essence.kind==='gold'){ score+=5; sCoin(); pops.push({x:m.x, y:m.y-18, txt:'+5', t:0.5, max:0.5, col:'#ffd23e'}); }
    else if(essence.kind==='bomb' && lastBoomSwing!==player.swingId){ lastBoomSwing=player.swingId; essenceBoom(m.x, m.y, m); }
  }
  if(m.hp<=0){
    hitstop=Math.max(hitstop, 0.07);
    killMob(m, 1, false);
    gainEssenceFrom(m);
  }
}

function comboMult(){ return Math.min(5, 1+Math.floor(combo/4)); }

function comboKeep(){ if(comboT>0) comboT=COMBO_WINDOW; }

function killMob(m, mul, terrain){
  m.hp=0;
  let sc=Math.max(1, Math.round(m.type.score*(mul===undefined?1:mul)));
  if(state==='play'){
    if(!terrain){
      const t0=comboMult();
      combo++; comboT=COMBO_WINDOW; comboPop=0.15;
      const t1=comboMult();
      if(t1>t0) sComboUp(t1);
      sc=Math.round(sc*t1);
    }
    score+=sc; kills++;
  }
  pops.push({x:m.x, y:m.y-12, txt:'+'+sc, t:0.8, max:0.8, col: terrain?'#c8cede':'#ffd23e'});
  if(m.type.bomb && !terrain){

    m.fusing=true; m.fuseT=1.2; m.kbx*=0.3; m.kby*=0.3;
    sTick();
    return;
  }
  m.deadFlag=true;
  shake=Math.max(shake,2); sKill(combo);
  burst(m.x, m.y-5, 14, [m.type.body, m.type.lite, m.type.dark], 85, 0.55, 130);
}

function explode(x,y){
  shake=Math.max(shake,6); sBoom();
  hitstop=Math.max(hitstop,0.06);
  shockwave(x, y-3, BOMB_R_PLAYER, '#ff9b3e');
  shockwave(x, y-3, 16, '#fff3c8');
  burst(x, y-4, 26, ['#ff7b2e','#ffd23e','#8a839c','#ffffff'], 120, 0.6, 90);
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2;
    parts.push({x:x+Math.cos(a)*4, y:y-4+Math.sin(a)*4, vx:Math.cos(a)*95, vy:Math.sin(a)*95,
      g:0, life:0.25, max:0.25, col:'#fff3c8', s:2});
  }

  if(state==='play' && !player.dead && player.inv<=0 &&
     Math.hypot(player.x-x, (player.y-6)-y)<BOMB_R_PLAYER){
    hurtPlayer({x,y}, 1);
  }

  for(const o of mobs){
    if(o.deadFlag || o.fusing || o.spawnT>0) continue;
    if(Math.hypot(o.x-x, o.y-y)<BOMB_R_MOB){
      o.hp-=2; o.flash=0.15;
      const a=Math.atan2(o.y-y, o.x-x);
      o.kbx+=Math.cos(a)*160*(o.type.kbMul||1); o.kby+=Math.sin(a)*160*(o.type.kbMul||1);
      if(o.hp<=0) killMob(o, 1, false);
    }
  }
}

function gainEssenceFrom(m){
  const kind=m.type.ess;
  if(!kind || state!=='play') return;
  essence={kind, t:ESSENCE_TIME};
  const E=ESSENCES[kind];
  pops.push({x:m.x, y:m.y-16, txt:E.name, t:0.9, max:0.9, col:E.col});
  burst(player.x, player.y-10, 8, [E.col, E.lite], 55, 0.4, 30);
  sEss();
}

function essenceBoom(x,y,src){
  shake=Math.max(shake,4); sEssBoom();
  hitstop=Math.max(hitstop,0.055);
  shockwave(x, y-2, BOMB_R_PLAYER, '#ffd23e');
  shockwave(x, y-2, 14, '#ffffff');
  burst(x, y-3, 18, ['#ff9b3e','#ffd23e','#ffffff'], 105, 0.4, 80);
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    parts.push({x:x+Math.cos(a)*3, y:y-2+Math.sin(a)*3, vx:Math.cos(a)*85, vy:Math.sin(a)*85,
      g:0, life:0.22, max:0.22, col:'#ffd23e', s:2});
  }
  for(const o of mobs){
    if(o===src || o.deadFlag || o.fusing || o.spawnT>0) continue;
    if(Math.hypot(o.x-x, o.y-y)<BOMB_R_PLAYER){
      o.hp--; o.flash=0.12;
      const a=Math.atan2(o.y-y, o.x-x);
      o.kbx+=Math.cos(a)*120*(o.type.kbMul||1); o.kby+=Math.sin(a)*120*(o.type.kbMul||1);
      comboKeep();
      if(o.hp<=0){ killMob(o, 1, false); gainEssenceFrom(o); }
    }
  }
}

function cactusHitMob(m, o){
  m.hp--; m.flash=0.12; m.hazCd=0.6;
  const a=Math.atan2(m.y-o.y, m.x-o.x);
  m.kbx+=Math.cos(a)*110; m.kby+=Math.sin(a)*110;
  burst(m.x, m.y-5, 4, ['#ffffff','#7cc47e'], 50, 0.3, 0);
  sHit();
  o.uses--;
  if(o.uses<=0){
    burst(o.x, o.y-5, 10, ['#4e9c52','#7cc47e','#fff8d8'], 70, 0.5, 100);
    obstacles=obstacles.filter(q=>q!==o);
    sPop();
  }
  if(m.hp<=0){ SAVE.rec.cactus++; killMob(m, 0.5, true); }
}

function updMob(m, dt){
  m.t+=dt;
  if(m.flash>0) m.flash-=dt;
  if(m.hitRecent>0) m.hitRecent-=dt;
  if(m.slowT>0){
    m.slowT-=dt;
    if(Math.random()<dt*9) parts.push({x:m.x+rnd(-5,5), y:m.y-rnd(4,13), vx:rnd(-4,4), vy:rnd(6,11), g:0, life:0.4, max:0.4, col:Math.random()<0.5?'#e8f8ff':'#a8dcec', s:Math.random()<0.3?2:1});
  }
  if(m.hazCd>0) m.hazCd-=dt;

  if(m.fusing){
    m.fuseT-=dt;
    if(m.fuseT>0 && Math.floor(m.fuseT/0.3)!==Math.floor((m.fuseT+dt)/0.3)) sTick();
    m.squishW=1+Math.sin(gameT*30)*0.15+(1.2-m.fuseT)*0.15;
    m.squishH=1-Math.sin(gameT*30)*0.1;
    if(m.fuseT<=0){ m.deadFlag=true; explode(m.x, m.y); }
    return;
  }
  if(m.spawnT>0){ m.spawnT-=dt; if(m.spawnT<=0) burst(m.x,m.y-4,6,['#ffffff','#dfe8ff'],45,0.3,0); return; }
  const mSpd=m.type.spd*(m.spdMul||1)*(m.slowT>0?0.55:1);

  if(m.type.kind==='slime'){
    m.pt-=dt;
    if(m.phase==='rest'){
      m.squishH=1+Math.sin(m.t*4)*0.06; m.squishW=1-Math.sin(m.t*4)*0.05; m.z=0;

      if(m.type.ranged && state==='play' && !player.dead){
        m.spit-=dt;
        const dd=Math.hypot(player.x-m.x, player.y-m.y);
        if(m.spit<=0 && dd>42 && dd<165){ m.phase='spit'; m.pt=0.38; }
      }
      if(m.phase==='rest' && m.pt<=0){ m.phase='wind'; m.pt=0.13; }
    } else if(m.phase==='spit'){

      const q=1-Math.max(0,m.pt)/0.38;
      m.squishW=1+q*0.25; m.squishH=1-q*0.15;
      if(m.pt<=0){
        const a=Math.atan2((player.y-8)-(m.y-4), player.x-m.x);
        shots.push({x:m.x+Math.cos(a)*4, y:m.y-4+Math.sin(a)*4,
                    vx:Math.cos(a)*88, vy:Math.sin(a)*88,
                    col:m.type.body, lite:m.type.lite});
        m.spit=m.type.spitCd*rnd(0.8,1.25);
        m.phase='rest'; m.pt=m.type.rest*rnd(0.9,1.3);
        sSpit();
        burst(m.x, m.y-5, 3, [m.type.lite], 30, 0.2, 0);
      }
    } else if(m.phase==='wind'){
      m.squishH=0.68; m.squishW=1.28;
      if(m.pt<=0){
        m.phase='air'; m.pt=m.type.air;
        let ang;
        if(state==='play' && !player.dead){
          const dx=player.x-m.x, dy=player.y-m.y, dd=Math.hypot(dx,dy);
          const toward=Math.atan2(dy,dx);
          if(m.type.ranged){

            if(dd<65) ang=toward+Math.PI+rnd(-0.5,0.5);
            else if(dd>115) ang=toward+rnd(-0.4,0.4);
            else ang=toward+(Math.random()<0.5?1:-1)*(Math.PI/2)+rnd(-0.3,0.3);
          } else ang=toward+rnd(-0.35,0.35);
        }
        else ang=rnd(0,Math.PI*2);
        ang=avoidHazards(m, ang);
        m.vx=Math.cos(ang)*mSpd; m.vy=Math.sin(ang)*mSpd;
      }
    } else if(m.phase==='air'){
      const pgr=1-m.pt/m.type.air;
      m.z=Math.sin(pgr*Math.PI)*6;
      m.squishH=1.18; m.squishW=0.85;
      m.x+=m.vx*dt; m.y+=m.vy*dt;
      if(m.pt<=0){
        m.phase='land'; m.pt=0.16; m.z=0;
        if(onIceAt(m.x,m.y)){ m.kbx+=m.vx*0.95; m.kby+=m.vy*0.95; }
        burst(m.x, m.y, 3, ['#6f9755','#c2a36b'], 30, 0.25, 60);
      }
    } else {
      m.squishH=0.62+ (1-m.pt/0.16)*0.38; m.squishW=1.32-(1-m.pt/0.16)*0.32;
      if(m.pt<=0){ m.phase='rest'; m.pt=m.type.rest*rnd(0.8,1.35); }
    }
  } else {
    m.flap=Math.floor(m.t*10)%2;
    if(state==='play' && !player.dead){
      const a=Math.atan2((player.y-5)-m.y, player.x-m.x);
      const s=Math.sin(m.t*4.5)*0.9;
      m.x+=(Math.cos(a)+Math.cos(a+Math.PI/2)*s*0.6)*mSpd*dt;
      m.y+=(Math.sin(a)+Math.sin(a+Math.PI/2)*s*0.6)*mSpd*dt;
    } else {
      m.x+=Math.cos(m.t*0.9)*mSpd*0.5*dt;
      m.y+=Math.sin(m.t*1.3)*mSpd*0.5*dt;
    }
  }

  m.x+=m.kbx*dt; m.y+=m.kby*dt;
  const dcy=Math.pow(onIceAt(m.x,m.y)?0.25:0.003, dt); m.kbx*=dcy; m.kby*=dcy;
  m.x=clamp(m.x,BX0,BX1); m.y=clamp(m.y,BY0,BY1);

  if(state==='play' && !m.deadFlag && m.type.kind!=='bat' && m.z<=2){
    const mr=mobRect(m);
    for(const o of obstacles){
      if(o.t<OBST_APPEAR) continue;
      if(o.kind==='cactus'){
        if(m.hazCd<=0 && overlap(mr, obstRect(o,0))){ cactusHitMob(m,o); break; }
      } else if(o.kind==='lava'){
        if(ptIn(obstRect(o,-3), m.x, m.y-2)){
          burst(m.x, m.y-2, 8, ['#ff7b2e','#3a1810', m.type.dark], 55, 0.4, 20);
          killMob(m, 0.5, true);
          break;
        }
      }
    }
  }
}

function avoidHazards(m, ang){
  if(!obstacles.length || m.type.kind==='bat') return ang;
  const hop=m.type.spd*(m.spdMul||1)*m.type.air;
  const tries=[0, 0.55, -0.55, 1.1, -1.1, 1.7, -1.7];
  for(const off of tries){
    const a=ang+off;
    const ex=m.x+Math.cos(a)*hop, ey=m.y+Math.sin(a)*hop;
    const mx=(m.x+ex)/2, my=(m.y+ey)/2;
    if(!hazardAtPoint(ex,ey,7) && !hazardAtPoint(mx,my,7)) return a;
  }
  return ang;
}

function drawMob(m){
  const gy=Math.round(m.y);
  if(m.spawnT>0){

    if(Math.floor(m.spawnT*12)%2===0){
      ctx.fillStyle='rgba(255,210,62,0.85)';
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2 + m.spawnT*5;
        ctx.fillRect(Math.round(m.x+Math.cos(a)*7)-1, Math.round(gy-4+Math.sin(a)*4)-1, 2,2);
      }
    }
    return;
  }
  const flash=m.flash>0 || (m.fusing && Math.floor(gameT*(10+(1.2-m.fuseT)*16))%2===0);
  const frozen=m.slowT>0;
  const fc=c=>frozen?frostCol(c):c;

  if(m.type.kind==='slime'){
    const w=Math.max(6,Math.round(12*m.squishW));
    const h=Math.max(4,Math.round(9*m.squishH));
    const x=Math.round(m.x), y=Math.round(m.y-m.z);
    shadow(m.x, m.y, Math.max(6, 10-(m.z|0)));
    pr(x-(w>>1)+1, y-h,   w-2, 2, fc(m.type.lite));
    pr(x-(w>>1)+1, y-h+1, w-2, h-2, fc(m.type.body));
    pr(x-(w>>1),   y-h+2, w,   h-4, fc(m.type.body));
    pr(x-(w>>1),   y-2,   w,   2, fc(m.type.dark));
    flushSprite(flash, frozen&&'#2a4a5c');
    if(!flash){
      const ex=Math.sign(player.x-m.x)||1;
      ctx.fillStyle='#ffffff';
      ctx.fillRect(x-3+ex, y-h+2, 2,2); ctx.fillRect(x+1+ex, y-h+2, 2,2);
      ctx.fillStyle='#173322';
      ctx.fillRect(x-3+ex+(ex>0?1:0), y-h+3, 1,1); ctx.fillRect(x+1+ex+(ex>0?1:0), y-h+3, 1,1);
      ctx.fillStyle=m.type.dark;
      if(m.phase==='spit') ctx.fillRect(x-2+ex, y-h+4, 4,2);
      else ctx.fillRect(x-1+ex, y-h+5, 2,1);
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.fillRect(x-(w>>1)+2, y-h+1, 2,1);
      if(m.type.bomb){
        ctx.fillStyle='#3a3540'; ctx.fillRect(x, y-h-2, 1,2);
        ctx.fillStyle=Math.floor(gameT*10)%2?'#ffd23e':'#ff7b2e';
        ctx.fillRect(x, y-h-3, 1,1);
      }
    }
    if(frozen && !flash){
      ctx.fillStyle='#e8f8ff';
      ctx.fillRect(x-4, y-h+1, 1, 2); ctx.fillRect(x+3, y-h+4, 1, 2); ctx.fillRect(x, y-h-1, 1, 1);
      ctx.fillStyle='#8fd0f2';
      ctx.fillRect(x-4, y-h+3, 1, 1); ctx.fillRect(x+3, y-h+6, 1, 1);
    }
  } else {

    const fy=Math.round(m.y-11-Math.sin(m.t*6)*1.5);
    const x=Math.round(m.x);
    shadow(m.x, m.y, 7);
    if(m.flap===0){
      pr(x-8, fy-4, 5, 2, fc(m.type.dark)); pr(x+3, fy-4, 5, 2, fc(m.type.dark));
      pr(x-7, fy-5, 3, 1, fc(m.type.body)); pr(x+4, fy-5, 3, 1, fc(m.type.body));
    } else {
      pr(x-8, fy+0, 5, 2, fc(m.type.dark)); pr(x+3, fy+0, 5, 2, fc(m.type.dark));
      pr(x-7, fy-1, 3, 1, fc(m.type.body)); pr(x+4, fy-1, 3, 1, fc(m.type.body));
    }
    pr(x-3, fy-3, 6, 5, fc(m.type.body));
    pr(x-3, fy-4, 1, 1, fc(m.type.body)); pr(x+2, fy-4, 1, 1, fc(m.type.body));
    flushSprite(flash, frozen&&'#2a4a5c');
    if(!flash){
      ctx.fillStyle='#ffe97a';
      ctx.fillRect(x-2, fy-2, 1,1); ctx.fillRect(x+1, fy-2, 1,1);
      ctx.fillStyle='#ffffff';
      ctx.fillRect(x-1, fy+1, 1,1); ctx.fillRect(x+0, fy+1, 1,1);
    }
    if(frozen && !flash){
      ctx.fillStyle='#e8f8ff';
      ctx.fillRect(x+2, fy-5, 1, 2); ctx.fillRect(x-3, fy-1, 1, 2);
    }
  }
}

function shockwave(x,y,r1,col){ rings.push({x,y,r1,t:0,max:0.28,col}); }
function burst(x,y,n,cols,spd,life,grav){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), v=rnd(spd*0.3,spd);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rnd(0,spd*0.4),
      g:grav, life:rnd(life*0.6,life), max:life,
      col:cols[(Math.random()*cols.length)|0], s:Math.random()<0.3?2:1});
  }
}
function updParts(dt){
  for(const p of parts){ p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){ p.y-=14*dt; p.t-=dt; }
  pops=pops.filter(p=>p.t>0);
  for(const g of ghosts) g.t-=dt;
  ghosts=ghosts.filter(g=>g.t>0);
  for(const r of rings) r.t+=dt;
  rings=rings.filter(r=>r.t<r.max);
}

function updShots(dt){
  for(const s of shots){
    if(s.dead) continue;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(Math.random()<0.35)
      parts.push({x:s.x,y:s.y,vx:rnd(-8,8),vy:rnd(-8,8),g:0,life:0.16,max:0.16,col:s.lite||'#b0d8ff',s:1});
    if(s.x<BX0-6||s.x>BX1+6||s.y<BY0-12||s.y>BY1+8){ s.dead=true; continue; }
    if(s.own){

      s.dist+=(Math.abs(s.vx)+Math.abs(s.vy))*dt;
      if(s.dist>16){
        for(const m of mobs){
          if(m.spawnT>0 || m.deadFlag || m.fusing || m.lastSwing===s.sid) continue;
          if(overlap({x:s.x-2, y:s.y-2, w:4, h:4}, mobRect(m))){
            s.dead=true;
            m.lastSwing=s.sid;
            m.hp--; m.flash=0.12; sHit(); hitstop=Math.max(hitstop,0.02);
            m.kbx+=s.vx*0.45; m.kby+=s.vy*0.45;
            comboKeep();
            burst(s.x, s.y, 5, ['#ffffff','#fff3c8'], 55, 0.25, 0);
            if(m.hp<=0){ killMob(m, 1, false); gainEssenceFrom(m); }
            break;
          }
        }
      }
      continue;
    }

    if(state==='play' && !player.dead && player.inv<=0){
      const prc={x:player.x-4, y:player.y-12, w:8, h:12};
      if(overlap(prc, {x:s.x-2, y:s.y-2, w:4, h:4})){ s.dead=true; hurtPlayer(s); continue; }
    }
  }
  shots=shots.filter(s=>!s.dead);
}
function drawShots(){
  for(const s of shots){
    const x=Math.round(s.x), y=Math.round(s.y);
    if(s.own){
      ctx.fillStyle='rgba(255,243,200,0.55)';
      ctx.fillRect(x-Math.sign(s.vx)*4-1, y-Math.sign(s.vy)*4-1, 2, 2);
    }
    ctx.fillStyle=C.out; ctx.fillRect(x-2,y-2,5,5);
    ctx.fillStyle=s.col||'#4a9df0'; ctx.fillRect(x-1,y-1,3,3);
    ctx.fillStyle=s.lite||'#d6ecff'; ctx.fillRect(x-1,y-1,1,1);
  }
}
function drawParts(){
  for(const r of rings){
    const q=r.t/r.max;
    const rad=6+(r.r1-6)*Math.sqrt(q);
    ctx.globalAlpha=(1-q)*0.9;
    ctx.fillStyle=r.col;
    const n=Math.max(12,(rad*2.4)|0);
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2;
      ctx.fillRect(Math.round(r.x+Math.cos(a)*rad)-1, Math.round(r.y+Math.sin(a)*rad)-1, 2, 2);
    }
  }
  ctx.globalAlpha=1;
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
  }
  ctx.globalAlpha=1;
  for(const p of pops){
    ctx.globalAlpha=clamp(p.t/p.max,0,1);
    drawText(p.txt, Math.round(p.x), Math.round(p.y)-5, 1, p.col, 'center');
  }
  ctx.globalAlpha=1;
}

function startWave(){
  wave++;
  banner={txt:'WAVE '+wave, t:1.5};
  clearObstacles(true);
  placeObstacles();
  const s=stageIdx, g=ngPlus, w=wave;
  const q=[];
  const add=(name,n)=>{ for(let i=0;i<Math.max(0,n|0);i++) q.push(name); };
  add('green', Math.min(10, 2+w+s+g));
  if(w>=2 || s>=1 || g>0) add('bat', Math.min(6, Math.floor((w+s)/2)+g));
  if(w>=3 || s>=1 || g>0) add('red', Math.min(6, w-2+s+g));
  if(s>=1 || g>0) add('sand',  Math.min(4, (s===1 ? w-1 : (s>1?2:1))+g));
  if(s>=2 || g>0) add('frost', Math.min(4, (s===2 ? w-1 : (s>2?2:1))+g));
  if(s>=3 || g>0) add('bomb',  Math.min(4, (s===3 ? w-1 : 1)+g));
  if(w===WAVES_PER_STAGE) add('gold', 1+Math.floor(s/2)+g);
  else if(w>=4 && s>=2) add('gold', 1);
  for(let i=q.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const tmp=q[i]; q[i]=q[j]; q[j]=tmp; }
  spawnQueue=q; spawnT=0.4;
  if(wave>1 && player.hp<player.maxHp){
    player.hp++;
    pops.push({x:player.x, y:player.y-26, txt:'HP +1', t:0.9, max:0.9, col:'#ff8f8f'});
    sHeal();
  }
  sWave();
}

function stageClear(){
  state='stagewait';
  const bonus=player.hp*40*(1+stageIdx+ngPlus*4);
  score+=bonus;
  best=Math.max(best,score);
  saveBest();

  SAVE.rec.sClear[stageIdx]=1;
  if(!runStageHit) SAVE.rec.anyNoHit=1;
  if(stageIdx===STAGES.length-1 && !runLoopHit) SAVE.rec.fullNoHit=1;
  checkUnlocks();
  const nuS=takeNewUnlocks();
  if(nuS.length){ stgNew.textContent='신규: '+nuS.join(' · '); stgNew.classList.remove('hidden'); }
  else stgNew.classList.add('hidden');
  player.hp=player.maxHp;
  clearObstacles(true);
  shots=[];
  const nextIdx=(stageIdx+1)%STAGES.length;
  const nextLoop=stageIdx===STAGES.length-1 ? ngPlus+2 : ngPlus+1;
  stgTitle.textContent='STAGE '+(stageIdx+1)+' 클리어!';
  stgBonus.textContent='+'+bonus;
  stgNext.textContent=(stageIdx===STAGES.length-1 ? nextLoop+'회차 ' : '')+STAGES[nextIdx].name;
  ovStage.classList.remove('hidden');
  sFanfare();
}
function advanceStage(){
  if(state!=='stagewait') return;
  keys[' ']=false; keys['enter']=false;
  stageIdx++;
  if(stageIdx>=STAGES.length){ stageIdx=0; ngPlus++; }
  runStageHit=false;
  if(stageIdx===0) runLoopHit=false;
  SAVE.rec.loop=Math.max(SAVE.rec.loop, ngPlus);
  checkUnlocks();
  buildTerrain(stageIdx);
  player.x=W/2; player.y=H/2+18; player.dir='down';
  player.kbx=0; player.kby=0; player.mvx=0; player.mvy=0;
  wave=0; nextWaveT=0.5; banner=null;
  ovStage.classList.add('hidden');
  state='play';
}

    const cflash=comboPop>0 && Math.floor(gameT*30)%2===0;
    const ctxt=(cm>1?'X'+cm+' ':'')+'COMBO '+combo;
    drawText(ctxt, W-5, 17, 1, cflash?'#ffffff':ccol, 'right');
    const cbw=textW(ctxt,1), cbx=W-5-cbw;
    ctx.fillStyle='rgba(24,27,36,0.8)'; ctx.fillRect(cbx, 24, cbw, 2);
    ctx.fillStyle=ccol; ctx.fillRect(cbx, 24, Math.round(cbw*clamp(comboT/COMBO_WINDOW,0,1)), 2);
  }
  const lp = ngPlus>0 ? 'X'+(ngPlus+1)+' ' : '';
  drawText(lp+'STAGE '+(stageIdx+1)+'-'+Math.max(1,wave), W/2, 4, 1, '#cfe3ff', 'center');
}
function drawBanner(){
  if(!banner) return;
  if(state!=='pause' && state!=='stagewait') banner.t-=lastDt;
  if(banner.t<=0){ banner=null; return; }
  const a=clamp(banner.t<0.3 ? banner.t/0.3 : (1.5-banner.t)<0.25 ? (1.5-banner.t)/0.25 : 1, 0, 1);
  ctx.globalAlpha=a;
  drawText(banner.txt, W/2, 56, 2, '#ffd23e', 'center');
  ctx.globalAlpha=1;
}

function resetWorld(){
  mobs=[]; parts=[]; pops=[]; spawnQueue=[]; shots=[]; ghosts=[]; rings=[];
  hitstop=0; wantDash=false;
  stageIdx=0; ngPlus=0; clearObstacles(false);
  essence=null; lastBoomSwing=-1;
  combo=0; comboT=0; comboPop=0;
  bgm.sIdx=-1; bgm.step=0;
  buildTerrain(0);
  player.x=W/2; player.y=H/2+18; player.dir='down';
  player.hp=player.maxHp; player.inv=0; player.atkT=0; player.atkCd=0;

let lastT=performance.now(), lastDt=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>0.05) dt=0.05;
  lastDt=dt;
  updBGM();
  if(state==='pause' || state==='stagewait'){ render(); return; }

  if(hitstop>0){ hitstop-=dt; render(); return; }
  gameT+=dt;

  if(state==='play'){
    updPlayer(dt);
    if(essence){
      essence.t-=dt;
      if(essence.t<=0){ essence=null; sEssEnd(); burst(player.x, player.y-10, 5, ['#cfd9f4','#9fb0d8'], 40, 0.3, 20); }
    }
    if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }
    if(comboPop>0) comboPop-=dt;

    if(spawnQueue.length>0){
      if(mobs.length<MOB_CAP){
        spawnT-=dt;
        if(spawnT<=0){
          spawnT=Math.max(0.3, 1.05-wave*0.05-stageIdx*0.07-ngPlus*0.06);
          spawnMob(spawnQueue.pop());
        }
      }
    } else if(mobs.length===0 && !player.dead){
      if(nextWaveT<0) nextWaveT=1.5;
      nextWaveT-=dt;
      if(nextWaveT<=0){
        nextWaveT=-1;
        if(wave>=WAVES_PER_STAGE) stageClear();
        else startWave();
      }
    }
    if(player.dead){
      deathT-=dt;
      if(deathT<=0) gameOver();
    }
  }
  for(const m of mobs) updMob(m,dt);
  mobs=mobs.filter(m=>!m.deadFlag);
  updObstacles(dt);
  updShots(dt);
  updParts(dt);
  if(shake>0) shake=Math.max(0,shake-dt*14);

  if(shopOpen) drawShopPreview(dt);
  render();
}

function render(){
  ctx.save();
  if(shake>0.1) ctx.translate(Math.round(rnd(-shake,shake)), Math.round(rnd(-shake,shake)));
  ctx.drawImage(bg,0,0);
  drawGroundObstacles();

  for(const m of mobs){
    if(!m.fusing) continue;
    const u=1-clamp(m.fuseT/1.2,0,1);
    const on=Math.floor(gameT*(6+u*16))%2===0;
    ctx.globalAlpha=on?0.55:0.22;
    ctx.fillStyle=u>0.66?'#ff5533':'#ff9b3e';
    for(let i=0;i<26;i++){
      const a=i/26*Math.PI*2 + gameT*1.2;
      ctx.fillRect(Math.round(m.x+Math.cos(a)*BOMB_R_PLAYER)-1, Math.round(m.y-2+Math.sin(a)*BOMB_R_PLAYER)-1, 2, 2);
    }
    ctx.globalAlpha=1;
  }

  for(const g of ghosts){
    ctx.globalAlpha=0.38*(g.t/g.max);
    ctx.fillStyle='#aee0ff';
    const gx=Math.round(g.x), gy=Math.round(g.y);
    ctx.fillRect(gx-5,gy-13,10,11);
    ctx.fillRect(gx-4,gy-23,8,10);
    ctx.globalAlpha=1;
  }

  const list=[];
  for(const m of mobs) list.push({y:m.y, f:drawMob, a:m});
  for(const o of obstacles) if(o.kind==='cactus') list.push({y:o.y, f:drawCactus, a:o});
  if(!player.dead) list.push({y:player.y+0.01, f:drawPlayer, a:null});
  list.sort((a,b)=>a.y-b.y);
  for(const e of list) e.a===null ? drawPlayer() : e.f(e.a);

  drawShots();

  if(!player.dead && player.dashCd>0 && state==='play'){
    const px_=Math.round(player.x), py_=Math.round(player.y);
    ctx.fillStyle='rgba(18,24,32,0.6)';
    ctx.fillRect(px_-5, py_+3, 10, 2);
    ctx.fillStyle='#7dd3ff';
    ctx.fillRect(px_-5, py_+3, Math.round(10*clamp(1-player.dashCd/DASH_CD,0,1)), 2);
  }

  drawParts();
  ctx.restore();

  drawHUD();
  drawBanner();
}

const touchUI=document.getElementById('touch');
const joy=document.getElementById('joy'), knob=document.getElementById('knob');
const atkBtn=document.getElementById('atkBtn');
if('ontouchstart' in window || navigator.maxTouchPoints>0){
  touchUI.classList.remove('hidden');

  let joyId=null;
  const findTouch=(list,id)=>{ for(let i=0;i<list.length;i++) if(list[i].identifier===id) return list[i]; return null; };
  const moveJoy=(t)=>{
    const r=joy.getBoundingClientRect();
    let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
    const len=Math.hypot(dx,dy), max=32;
    if(len>max){ dx=dx/len*max; dy=dy/len*max; }
    joyVec={x:dx/max, y:dy/max};
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
  };
  const resetJoy=()=>{ joyId=null; joyVec={x:0,y:0}; knob.style.transform='translate(0,0)'; };
  joy.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(joyId===null && e.changedTouches.length>0) joyId=e.changedTouches[0].identifier;
    const t=findTouch(e.changedTouches, joyId);
    if(t) moveJoy(t);
  },{passive:false});
  joy.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(joyId===null) return;
    const t=findTouch(e.changedTouches, joyId);
    if(t) moveJoy(t);
  },{passive:false});
  const endJoy=(e)=>{
    e.preventDefault();
    if(joyId!==null && findTouch(e.changedTouches, joyId)) resetJoy();
  };
  joy.addEventListener('touchend',endJoy,{passive:false});
  joy.addEventListener('touchcancel',endJoy,{passive:false});
  atkBtn.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); touchAtk=true; },{passive:false});
  atkBtn.addEventListener('touchend',e=>{ e.preventDefault(); touchAtk=false; },{passive:false});
  const dashBtn=document.getElementById('dashBtn');
  dashBtn.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); if(state==='play') wantDash=true; },{passive:false});
  dashBtn.addEventListener('touchend',e=>{ e.preventDefault(); },{passive:false});
}

function flushTo(g,R2){
  g.fillStyle=C.out;
  for(const r of R2) g.fillRect(r[0]-1, r[1]-1, r[2]+2, r[3]+2);
  for(const r of R2){ g.fillStyle=r[4]; g.fillRect(r[0],r[1],r[2],r[3]); }
}

function itemState(it){
  if(SAVE.equip[shopCat]===it.id) return 'equipped';
  if(SAVE.owned.includes(it.id)) return 'owned';
  if(it.ach) return it.secret?'secret':'achieve';
  if(it.cond && !it.cond.ok()) return 'locked';
  return 'buy';
}

function drawItemIcon(cv,it,st){
  const g=cv.getContext('2d');

  g.setTransform(2,0,0,2,0,0);
  const R2=[], p=(x,y,w,h,c)=>R2.push([Math.round(x),Math.round(y),w,h,c]);
  if(shopCat==='helm'){
    (HELM_PARTS[it.id]||HELM_PARTS.steel)(p,11,30);
    flushTo(g,R2);
    if(it.id==='slimehat'){
      g.fillStyle='#ffffff'; g.fillRect(9,6,1,2); g.fillRect(12,6,1,2);
      g.fillStyle='#173322'; g.fillRect(9,7,1,1); g.fillRect(12,7,1,1);

  } else if(shopCat==='outfit'){
    const O=OUTFITS[it.id]||OUTFITS.blue;
    p(4,12,2,4,O.dark); p(4,16,2,2,C.skin);

    const Wd=WEAPONS[eq.weapon]||WEAPONS.sword;
    const tr=Wd.trail||'255,255,255';
    for(let i=0;i<=7;i++){
      const ta=start+(A-start)*(i/7);
      g.fillStyle='rgba('+tr+','+(0.08+0.40*(i/7))+')';
      g.fillRect(Math.round(hx+Math.cos(ta)*16)-1, Math.round(hy+Math.sin(ta)*16)-1, 2,2);
      g.fillRect(Math.round(hx+Math.cos(ta)*12)-1, Math.round(hy+Math.sin(ta)*12)-1, 2,2);
      g.fillRect(Math.round(hx+Math.cos(ta)*8)-1,  Math.round(hy+Math.sin(ta)*8)-1,  2,2);
    }
    const R3=[];
    for(const r of Wd.build(hx,hy,A,Wd.g,Wd.t)) R3.push([Math.round(r[0]),Math.round(r[1]),r[2],r[3],r[4]]);
    R3.push([hx-1,hy-1,3,3,O.dark]);
    R3.push([Math.round(hx+Math.cos(A)*2.5)-1, Math.round(hy+Math.sin(A)*2.5)-1, 3, 3, C.skin]);
    flushTo(g,R3);
  }
}

document.getElementById('btnShop').addEventListener('click',()=>{ initAudio(); openShop(ovStart); });
document.getElementById('btnShop2').addEventListener('click',()=>{ initAudio(); openShop(ovOver); });
btnShopClose.addEventListener('click',()=>closeShop());

fit();
spawnDemo();
requestAnimationFrame(loop);
</script>
