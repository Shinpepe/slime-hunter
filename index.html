<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>픽셀 슬라임 헌터</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
  body{
    background:#14161e;
    display:flex;align-items:center;justify-content:center;
    font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    color:#e8ecf8;
  }
  #wrap{position:relative;line-height:0}
  canvas{
    display:block;background:#79a35f;
    image-rendering:pixelated;image-rendering:crisp-edges;
    border:4px solid #0d0f16;box-shadow:0 8px 0 #0a0c12;
  }
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(13,15,23,.72);line-height:1.5;z-index:5;
  }
  .hidden{display:none}
  .panel{
    background:#20263a;border:4px solid #4a5578;
    box-shadow:0 6px 0 #0d0f16, inset 0 0 0 3px #141828;
    padding:20px 30px;text-align:center;max-width:86%;
  }
  h1{
    margin:0 0 4px;font-size:30px;letter-spacing:2px;color:#ffd23e;
    text-shadow:3px 3px 0 #8c3d2f;
  }
  h2{margin:0 0 8px;font-size:24px;letter-spacing:2px;color:#ff6b6b;text-shadow:3px 3px 0 #4a1420}
  .sub{font-size:13px;color:#9fb0d8;margin:0 0 14px}
  .controls{font-size:13px;color:#cfd9f4;margin:0 0 16px;text-align:left;display:inline-block}
  .controls div{margin:5px 0}
  .kbd{
    display:inline-block;background:#39415e;border:2px solid #11141f;border-bottom-width:4px;
    padding:1px 8px;border-radius:4px;font-weight:700;font-size:11px;color:#fff;
    line-height:1.5;margin:0 2px;
  }
  .btn{
    font-family:inherit;font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;
    background:#ffd23e;color:#3a2a10;border:3px solid #11141f;border-radius:4px;
    padding:9px 26px;box-shadow:0 5px 0 #11141f;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #11141f}
  .stats{font-size:14px;margin:0 0 16px;color:#cfd9f4}
  .stats b{color:#ffd23e;font-size:16px}
  .stats div{margin:4px 0}
  #muteBtn{
    position:absolute;right:8px;bottom:8px;z-index:6;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:700;
    background:rgba(20,24,40,.55);color:#cfd9f4;border:2px solid rgba(255,255,255,.25);
    border-radius:4px;padding:3px 8px;
  }
  /* 모바일 터치 컨트롤 */
  #touch{position:absolute;inset:0;z-index:4;pointer-events:none}
  #joy{
    position:absolute;left:16px;bottom:16px;width:96px;height:96px;border-radius:50%;
    background:rgba(20,24,40,.35);border:3px solid rgba(255,255,255,.28);
    pointer-events:auto;
  }
  #knob{
    position:absolute;left:26px;top:26px;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.45);border:3px solid rgba(255,255,255,.5);
  }
  #atkBtn{
    position:absolute;right:20px;bottom:24px;width:78px;height:78px;border-radius:50%;
    background:rgba(232,74,74,.5);border:3px solid rgba(255,255,255,.35);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:#fff;text-shadow:1px 1px 0 #501010;line-height:1;
  }
  #dashBtn{
    position:absolute;right:106px;bottom:44px;width:54px;height:54px;border-radius:50%;
    background:rgba(74,157,240,.5);border:3px solid rgba(255,255,255,.35);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12px;color:#fff;text-shadow:1px 1px 0 #103050;line-height:1;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="320" height="180"></canvas>

  <div class="overlay" id="ovStart">
    <div class="panel">
      <h1>픽셀 슬라임 헌터</h1>
      <p class="sub">들판을 점령한 슬라임을 물리치세요!</p>
      <div class="controls">
        <div><span class="kbd">←↑↓→</span> / <span class="kbd">WASD</span> 이동</div>
        <div><span class="kbd">SPACE</span> / <span class="kbd">Z</span> 검 휘두르기</div>
        <div><span class="kbd">SHIFT</span> / <span class="kbd">X</span> 대시 (몬스터 몸통 통과)</div>
        <div><span class="kbd">P</span> 일시정지 &nbsp; <span class="kbd">M</span> 소리 켜기/끄기</div>
      </div>
      <br>
      <button class="btn" id="btnStart">게임 시작</button>
    </div>
  </div>

  <div class="overlay hidden" id="ovStage">
    <div class="panel">
      <h2 id="stgTitle" style="color:#ffd76e;text-shadow:3px 3px 0 #7a4d12">STAGE 1 클리어!</h2>
      <div class="stats">
        <div>남은 하트 보너스 <b id="stgBonus">+0</b></div>
        <div>다음 스테이지 <b id="stgNext">사막</b></div>
      </div>
      <button class="btn" id="btnStageNext">계속 (Enter)</button>
    </div>
  </div>

  <div class="overlay hidden" id="ovOver">
    <div class="panel">
      <h2>게임 오버</h2>
      <div class="stats">
        <div>점수 <b id="stScore">0</b></div>
        <div>최고 기록 <b id="stBest">0</b></div>
        <div>처치한 몬스터 <b id="stKills">0</b></div>
        <div>도달 지점 <b id="stWave">1-1</b></div>
      </div>
      <button class="btn" id="btnRetry">다시 시작 (R)</button>
    </div>
  </div>

  <div class="overlay hidden" id="ovPause">
    <div class="panel">
      <h2 style="color:#9fd0ff;text-shadow:3px 3px 0 #1e3a5c">일시정지</h2>
      <button class="btn" id="btnResume">계속하기</button>
    </div>
  </div>

  <div id="touch" class="hidden">
    <div id="joy"><div id="knob"></div></div>
    <div id="dashBtn">대시</div>
    <div id="atkBtn">공격</div>
  </div>

  <button id="muteBtn">소리 켬</button>
</div>

<script>
'use strict';
/* ==========================================================
   픽셀 슬라임 헌터
   - 내부 해상도 320x180 캔버스를 확대해서 픽셀아트 느낌을 냅니다.
   - 모든 스프라이트는 코드(사각형 픽셀)로 그려서 파일 하나로 완결됩니다.
   ========================================================== */

const W = 320, H = 180;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- 팔레트 ---------- */
const C = {
  out:  '#22252e',           // 외곽선
  steel:'#5a6988', steelL:'#9db0cc',
  skin: '#ffcf9e',
  blue: '#3b6ee0', blueD:'#2a4bb8', pants:'#3a4466',
  brown:'#8a5a34', brownD:'#66401f',
  gold: '#ffd23e',
  red:  '#e84a4a',
  white:'#f8f8f8',
};

/* 몬스터 종류 정의 */
const MOB_TYPES = {
  green:{kind:'slime', body:'#3ecf5e', lite:'#9cf7a9', dark:'#27994a', hp:2, score:10,  rest:0.55, air:0.40, spd:62, kbMul:1},
  red:  {kind:'slime', body:'#f05555', lite:'#ffb0b0', dark:'#b02f2f', hp:3, score:25,  rest:0.38, air:0.38, spd:80, kbMul:0.85},
  gold: {kind:'slime', body:'#ffc93e', lite:'#ffe9a8', dark:'#c4891c', hp:5, score:60,  rest:0.30, air:0.36, spd:92, kbMul:0.55},
  sand: {kind:'slime', ranged:true, body:'#e3c076', lite:'#f6e6b2', dark:'#a9823f', hp:2, score:30, rest:0.50, air:0.42, spd:70, spitCd:2.3, kbMul:1},
  frost:{kind:'slime', chill:true, body:'#7fd6ea', lite:'#d6f6fd', dark:'#3f93ad', hp:2, score:20, rest:0.50, air:0.40, spd:66, kbMul:1},
  bomb: {kind:'slime', bomb:true, body:'#565064', lite:'#8a839c', dark:'#332e40', hp:2, score:35, rest:0.42, air:0.38, spd:76, kbMul:0.9},
  bat:  {kind:'bat',   body:'#8b6ad1', lite:'#c9b3f2', dark:'#5f47a8', hp:1, score:15,  spd:44, kbMul:1.15},
};

/* 스테이지 정의 (팔레트 + 장애물 종류) */
const STAGES=[
 {name:'초원', ename:'MEADOW',   obst:null,     base:'#79a35f', mot:['#83ad68','#6f9755'], tuft:'#5c8548', deco:'flower',  patch:['#c2a36b','#a8894f'], rock:['#8b95a8','#b8c2d4','#5c6577'], borderA:'#3f6d3a', borderB:'#4e8347', borderD:'#2c4d29', topA:'#2e4d33', topB:['#3a5f40','#264229'], topLine:'#1e3522'},
 {name:'사막', ename:'DESERT',   obst:'cactus', base:'#dcb97e', mot:['#e4c48c','#cfa868'], tuft:'#a8874e', deco:'stone',   patch:['#c49a5e','#a87f45'], rock:['#9a8468','#c4b096','#6e5c44'], borderA:'#b08d52', borderB:'#c9a468', borderD:'#8a6b3a', topA:'#8a6b3f', topB:['#9c7c4c','#755932'], topLine:'#5e4626'},
 {name:'설원', ename:'SNOW FIELD', obst:'ice',  base:'#dfe9f2', mot:['#eef5fb','#cbd9e6'], tuft:'#a4b8c8', deco:'crystal', patch:['#c2d2e0','#a8bccf'], rock:['#8b98ab','#c2cdd9','#5f6b7c'], borderA:'#a9bfd2', borderB:'#c4d6e6', borderD:'#7f96ac', topA:'#5a7089', topB:['#68809a','#4a5f76'], topLine:'#3a4c60'},
 {name:'화산', ename:'VOLCANO',  obst:'lava',   base:'#4e4449', mot:['#5a4f55','#423940'], tuft:'#6e3a2a', deco:'ember',   patch:['#3a3136','#2e272b'], rock:['#6a5f66','#8d8290','#3e363d'], borderA:'#3a3138', borderB:'#4a4048', borderD:'#26212a', topA:'#2c2530', topB:['#382f3c','#201b26'], topLine:'#161218'},
];
const WAVES_PER_STAGE=5, MOB_CAP=9;

/* 이동 가능 범위 (발 기준 좌표) */
const BX0=12, BX1=308, BY0=34, BY1=168;

/* ---------- 상태 ---------- */
let state = 'start';        // start | play | pause | over
let score=0, best=0, kills=0, wave=0;
let nextWaveT=-1, banner=null, shake=0, gameT=0, deathT=0;
let mobs=[], parts=[], pops=[], spawnQueue=[], spawnT=0;
let shots=[], ghosts=[], hitstop=0, wantDash=false;
let stageIdx=0, ngPlus=0, obstacles=[];
let muted=false;

const player = {
  x:W/2, y:H/2+18, dir:'down', moving:false, animT:0,
  hp:4, maxHp:4, inv:0, atkT:0, atkCd:0, swingId:0, kbx:0, kby:0, dead:false,
  dashT:0, dashCd:0, dashGrace:0, dashVx:0, dashVy:0,
  mvx:0, mvy:0, slowT:0
};
const P_SPEED=78, ATK_TIME=0.24, ATK_CD=0.42;
const DASH_TIME=0.16, DASH_CD=1.0, DASH_SPD=250, DASH_GRACE=0.10;

/* ---------- 유틸 ---------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a,b)=>a+Math.random()*(b-a);
const overlap=(a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

/* ---------- 사운드 (Web Audio 8비트풍 효과음) ---------- */
let actx=null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function beep(freq, dur, type, vol, slideTo){
  if(muted || !actx) return;
  const t0=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
  g.gain.setValueAtTime(vol||0.07, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const sSwing =()=> beep(300,0.09,'sawtooth',0.05,120);
const sHit   =()=> beep(340,0.06,'square',0.07,200);
const sKill  =()=>{ beep(520,0.07,'square',0.07); setTimeout(()=>beep(320,0.10,'square',0.07,150),60); };
const sHurt  =()=> beep(120,0.22,'sawtooth',0.10,60);
const sDie   =()=>{ beep(240,0.3,'sawtooth',0.10,50); setTimeout(()=>beep(120,0.5,'triangle',0.10,35),200); };
const sHeal  =()=>{ beep(660,0.08,'triangle',0.07); setTimeout(()=>beep(880,0.12,'triangle',0.07),90); };
const sWave  =()=>{ [392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.10,'square',0.06),i*90)); };
const sDash  =()=> beep(170,0.13,'triangle',0.07,640);
const sSpit  =()=> beep(460,0.09,'square',0.05,180);
const sPop   =()=> beep(760,0.05,'square',0.06,300);
const sBoom  =()=>{ beep(90,0.35,'sawtooth',0.13,40); beep(200,0.2,'square',0.08,60); };
const sTick  =()=> beep(880,0.04,'square',0.05);

/* ---------- 입력 ---------- */
const keys={};
let touchAtk=false, joyVec={x:0,y:0};
const k=(name)=>!!keys[name];

window.addEventListener('keydown', e=>{
  const key=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(key)) e.preventDefault();
  keys[key]=true;
  if(key==='m') toggleMute();
  if((key==='shift'||key==='x') && !e.repeat) wantDash=true;
  if(state==='start' && (key==='enter'||key===' ')) startGame();
  else if(state==='over' && (key==='enter'||key==='r')) startGame();
  else if(state==='stagewait' && (key==='enter'||key===' ')) advanceStage();
  else if(state==='play' && (key==='p'||key==='escape')) setPause(true);
  else if(state==='pause' && (key==='p'||key==='escape'||key==='enter')) setPause(false);
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur', ()=>{ for(const key in keys) keys[key]=false; joyVec={x:0,y:0}; touchAtk=false; wantDash=false; });

/* ---------- 배경(잔디밭) 미리 그리기 ---------- */
const bg=document.createElement('canvas'); bg.width=W; bg.height=H;
function buildTerrain(sIdx){
  const P=STAGES[sIdx];
  const g=bg.getContext('2d');
  g.fillStyle=P.base; g.fillRect(0,0,W,H);
  // 바닥 얼룩
  for(let i=0;i<420;i++){
    g.fillStyle = Math.random()<0.5 ? P.mot[0] : P.mot[1];
    g.fillRect((Math.random()*W)|0, (Math.random()*H)|0, 2, 2);
  }
  // 풀/마른풀/잔가지
  g.fillStyle=P.tuft;
  for(let i=0;i<70;i++){
    const x=(rnd(8,W-10))|0, y=(rnd(26,H-14))|0;
    g.fillRect(x,y-1,1,2); g.fillRect(x+2,y-1,1,2); g.fillRect(x+1,y,1,1);
  }
  // 바닥 자국
  for(let i=0;i<7;i++){
    const x=(rnd(24,W-40))|0, y=(rnd(44,H-30))|0;
    g.fillStyle=P.patch[0];
    g.fillRect(x,y,rnd(6,12)|0,rnd(3,5)|0);
    g.fillStyle=P.patch[1];
    g.fillRect(x+1,y+1,3,2);
  }
  // 스테이지별 장식
  for(let i=0;i<16;i++){
    const x=(rnd(14,W-16))|0, y=(rnd(30,H-16))|0;
    if(P.deco==='flower'){
      g.fillStyle=['#ffffff','#ffd23e','#ff9ecb'][(Math.random()*3)|0];
      g.fillRect(x-1,y,1,1); g.fillRect(x+1,y,1,1); g.fillRect(x,y-1,1,1); g.fillRect(x,y+1,1,1);
      g.fillStyle='#e0b62a'; g.fillRect(x,y,1,1);
    } else if(P.deco==='stone'){
      g.fillStyle='#b59a6e'; g.fillRect(x,y,2,2);
      g.fillStyle='#8a7148'; g.fillRect(x,y+1,2,1);
    } else if(P.deco==='crystal'){
      g.fillStyle='#bfe8ff'; g.fillRect(x,y-1,1,1); g.fillRect(x,y+1,1,1);
      g.fillStyle='#8fd0f2'; g.fillRect(x-1,y,3,1);
    } else { // ember: 잉걸불 + 균열
      g.fillStyle=Math.random()<0.5?'#ff7b2e':'#c94a1a';
      g.fillRect(x,y,1,1);
      g.fillStyle='#2a2126'; g.fillRect(x-2,y+1,4,1);
    }
  }
  // 돌
  for(let i=0;i<5;i++){
    const x=(rnd(20,W-26))|0, y=(rnd(48,H-26))|0;
    g.fillStyle=P.rock[0]; g.fillRect(x,y,5,3);
    g.fillStyle=P.rock[1]; g.fillRect(x+1,y,2,1);
    g.fillStyle=P.rock[2]; g.fillRect(x,y+2,5,1);
  }
  // 위쪽 경계(HUD 배경 겸용)
  g.fillStyle=P.topA; g.fillRect(0,0,W,15);
  for(let i=0;i<160;i++){
    g.fillStyle=Math.random()<0.5?P.topB[0]:P.topB[1];
    g.fillRect((Math.random()*W)|0,(Math.random()*13)|0,2,2);
  }
  g.fillStyle=P.topLine; g.fillRect(0,14,W,1);
  // 아래/좌우 경계
  const bush=(x,y)=>{
    g.fillStyle=P.borderA; g.fillRect(x,y+2,10,5);
    g.fillRect(x+2,y,6,7);
    g.fillStyle=P.borderB; g.fillRect(x+3,y+1,3,2);
    g.fillStyle=P.borderD; g.fillRect(x+1,y+6,8,1);
  };
  for(let x=-2;x<W;x+=13) bush(x, H-8+((x/13)%2));
  for(let y=18;y<H-10;y+=14){ bush(-4,y); bush(W-7,y); }
}
buildTerrain(0);

/* ==========================================================
   장애물 시스템 (선인장/빙판/용암) — 웨이브마다 재배치
   ========================================================== */
function obstRad(o){ return o.kind==='cactus' ? 7 : Math.max(o.w,o.h)/2; }
function obstRect(o, pad){
  pad=pad||0;
  if(o.kind==='cactus') return {x:o.x-4-pad, y:o.y-10-pad, w:8+pad*2, h:10+pad*2};
  return {x:o.x-o.w/2-pad, y:o.y-o.h/2-pad, w:o.w+pad*2, h:o.h+pad*2};
}
function ptIn(r, x, y){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
function onIceAt(x,y){
  for(const o of obstacles) if(o.kind==='ice' && ptIn(obstRect(o,-2),x,y)) return true;
  return false;
}
function hazardAtPoint(x,y,pad){
  for(const o of obstacles){
    if(o.kind==='ice') continue;
    if(ptIn(obstRect(o,pad),x,y)) return true;
  }
  return false;
}

function clearObstacles(withFx){
  if(withFx) for(const o of obstacles){
    const cols = o.kind==='cactus' ? ['#4e9c52','#7cc47e'] :
                 o.kind==='ice' ? ['#d6f2ff','#a8d8ec'] : ['#ff7b2e','#5a3020'];
    burst(o.x, o.y-3, 6, cols, 40, 0.35, 60);
  }
  obstacles=[];
}

function placeObstacles(){
  clearObstacles(false);
  const kind=STAGES[stageIdx].obst;
  if(!kind) return;
  let count, mkSize;
  if(kind==='cactus'){ count=3+((Math.random()*3)|0); mkSize=()=>({w:8,h:10}); }
  else if(kind==='ice'){ count=2+((Math.random()*2)|0); mkSize=()=>({w:(rnd(40,56))|0,h:(rnd(26,34))|0}); }
  else { count=2; mkSize=()=>({w:(rnd(34,40))|0,h:(rnd(22,26))|0}); }
  const field=(BX1-BX0)*(BY1-BY0);
  const areaCap = kind==='ice' ? field*0.25 : field*0.15;
  let area=0;
  for(let n=0;n<count;n++){
    const sz=mkSize();
    if(area+sz.w*sz.h>areaCap) break;
    let placed=false;
    for(let t=0;t<60 && !placed;t++){
      const hw=sz.w/2, hh=sz.h/2;
      const cx=rnd(BX0+16+hw, BX1-16-hw);
      const cy=rnd(BY0+12+hh, BY1-10-hh);
      if(Math.hypot(cx-player.x, cy-player.y)<45+Math.max(hw,hh)) continue; // 플레이어 여유 공간
      let ok=true;
      for(const o of obstacles){
        const need=obstRad({kind,w:sz.w,h:sz.h}) + obstRad(o) + 26; // 통로 확보
        if(Math.hypot(cx-o.x, cy-o.y) < Math.max(40,need)){ ok=false; break; }
      }
      if(!ok) continue;
      obstacles.push({kind, x:cx, y:cy, w:sz.w, h:sz.h, uses:3, t:0, seed:Math.random()*10});
      area+=sz.w*sz.h;
      placed=true;
    }
  }
}

function updObstacles(dt){
  for(const o of obstacles){
    o.t+=dt;
    if(o.kind==='lava' && Math.random()<dt*2.2){ // 잉걸불 상승
      parts.push({x:o.x+rnd(-o.w/2+3,o.w/2-3), y:o.y+rnd(-o.h/2+2,o.h/2-2),
        vx:rnd(-4,4), vy:rnd(-16,-8), g:-14, life:rnd(0.4,0.7), max:0.7, col:'#ff9b3e', s:1});
    }
  }
}

/* 바닥형 장애물 (빙판/용암) — 배경 직후에 그림 */
function drawGroundObstacles(){
  for(const o of obstacles){
    const ap=clamp(o.t/0.4,0,1); // 등장 연출
    if(o.kind==='ice'){
      const w=(o.w*ap)|0, h=(o.h*ap)|0;
      const x=Math.round(o.x-w/2), y=Math.round(o.y-h/2);
      ctx.fillStyle='#8ab8cc'; ctx.fillRect(x-1,y-1,w+2,h+2);
      ctx.fillStyle='#bfe6f2'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#e8f8ff';
      ctx.fillRect(x+3,y+2,(w*0.4)|0,2); ctx.fillRect(x+(w*0.5|0),y+h-5,(w*0.3)|0,2);
      ctx.fillStyle='#9cc8dc';
      ctx.fillRect(x+(w*0.3|0),y+(h*0.4|0),(w*0.35)|0,1);
    } else if(o.kind==='lava'){
      const w=(o.w*ap)|0, h=(o.h*ap)|0;
      const x=Math.round(o.x-w/2), y=Math.round(o.y-h/2);
      ctx.fillStyle='#3a1810'; ctx.fillRect(x-2,y-2,w+4,h+4);
      ctx.fillStyle='#c94a1a'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#ff7b2e'; ctx.fillRect(x+2,y+2,w-4,h-4);
      // 부글거리는 밝은 점
      ctx.fillStyle='#ffd23e';
      for(let i=0;i<4;i++){
        const bx=x+3+((Math.sin(gameT*1.7+o.seed+i*2.1)*0.5+0.5)*(w-8))|0;
        const by=y+3+((Math.cos(gameT*1.3+o.seed*2+i*1.7)*0.5+0.5)*(h-8))|0;
        ctx.fillRect(bx,by,2,2);
      }
    }
  }
}

/* 선인장 — y정렬 대상(입체물) */
function drawCactus(o){
  const ap=clamp(o.t/0.4,0,1);
  const x=Math.round(o.x), y=Math.round(o.y);
  shadow(x, y, 8);
  const h=Math.round(11*ap);
  if(h<2) return;
  pr(x-2, y-h, 4, h, '#4e9c52');
  pr(x-2, y-h, 2, h, '#7cc47e');
  if(ap>0.8){
    pr(x-6, y-h+3, 4, 2, '#4e9c52'); pr(x-6, y-h+1, 2, 4, '#4e9c52');
    pr(x+2, y-h+4, 4, 2, '#4e9c52'); pr(x+4, y-h+2, 2, 4, '#4e9c52');
  }
  flushSprite(false);
  if(ap>0.8){
    ctx.fillStyle='#fff8d8'; // 가시
    ctx.fillRect(x-3,y-h+2,1,1); ctx.fillRect(x+2,y-h+5,1,1);
    ctx.fillRect(x-1,y-h-1,1,1); ctx.fillRect(x+1,y-4,1,1);
    ctx.fillStyle='#ff9ecb'; ctx.fillRect(x-1,y-h-2,2,1); // 꽃
    if(o.uses<3){ ctx.fillStyle='#2f6b38'; ctx.fillRect(x-1,y-((h*0.6)|0),2,1); } // 손상 흔적
  }
}

/* ==========================================================
   픽셀 스프라이트 그리기 헬퍼
   - pr()로 사각형을 모으고 flushSprite()가 외곽선과 함께 그립니다.
   ========================================================== */
let R=[];
function pr(x,y,w,h,c){ R.push([Math.round(x),Math.round(y),w,h,c]); }
function flushSprite(flashWhite){
  ctx.fillStyle=C.out;
  for(const r of R) ctx.fillRect(r[0]-1, r[1]-1, r[2]+2, r[3]+2);
  for(const r of R){ ctx.fillStyle = flashWhite ? '#ffffff' : r[4]; ctx.fillRect(r[0],r[1],r[2],r[3]); }
  R=[];
}
function shadow(x,y,w){
  ctx.fillStyle='rgba(18,24,32,0.30)';
  ctx.fillRect(Math.round(x-w/2), Math.round(y-1), w, 3);
  ctx.fillRect(Math.round(x-w/2+1), Math.round(y-2), w-2, 1);
}

/* ---------- 픽셀 하트 (HUD) ---------- */
const HEART=['.RR.RR.','RWRRRRR','RRRRRRR','.RRRRR.','..RRR..','...R...'];
function drawMap(x,y,rows,cols){
  for(let j=0;j<rows.length;j++)
    for(let i=0;i<rows[j].length;i++){
      const ch=rows[j][i];
      if(ch==='.') continue;
      ctx.fillStyle=cols[ch]||'#fff';
      ctx.fillRect(x+i,y+j,1,1);
    }
}
function drawHeart(x,y,full){
  drawMap(x+1,y+1,HEART,{R:'#181b24',W:'#181b24'});
  drawMap(x,y,HEART, full ? {R:'#e84a4a',W:'#ffb3b3'} : {R:'#3a4258',W:'#4a5470'});
}

function textW(str,sc){
  let w=0;
  for(const ch of str){ const g=FONT[ch]||FONT[' ']; w+=(g[0].length+1)*sc; }
  return Math.max(0,w-sc);
}
function drawGlyphs(str,cx,y,sc,col){
  ctx.fillStyle=col;
  for(const ch of str){
    const g=FONT[ch]||FONT[' '];
    for(let r=0;r<5;r++)
      for(let c=0;c<g[r].length;c++)
        if(g[r][c]==='1') ctx.fillRect(cx+c*sc, y+r*sc, sc, sc);
    cx+=(g[0].length+1)*sc;
  }
}
function drawText(str,x,y,sc,col,align){
  str=String(str).toUpperCase();
  const w=textW(str,sc);
  let cx = align==='center' ? x-w/2 : align==='right' ? x-w : x;
  cx=Math.round(cx); y=Math.round(y);
  drawGlyphs(str,cx+sc,y+sc,sc,'#181b24'); // 그림자
  drawGlyphs(str,cx,y,sc,col);
}

/* ==========================================================
   플레이어 (기사)
   ========================================================== */
const DIRV={right:[1,0], left:[-1,0], up:[0,-1], down:[0,1]};

function swingRect(){
  const x=player.x, y=player.y-9;
  switch(player.dir){
    case 'right': return {x:x+2,  y:y-13, w:22, h:26};
    case 'left':  return {x:x-24, y:y-13, w:22, h:26};
    case 'up':    return {x:x-13, y:y-24, w:26, h:22};
    default:      return {x:x-13, y:y+2,  w:26, h:22};
  }
}

function tryAttack(){
  if(player.atkCd>0 || player.dead) return;
  player.atkT=ATK_TIME; player.atkCd=ATK_CD; player.swingId++;
  sSwing();
}

function hurtPlayer(src, dmg){
  player.hp-=(dmg||1); player.inv=1.25; shake=5; sHurt();
  hitstop=Math.max(hitstop, 0.08);
  if(src.type && src.type.chill){ player.slowT=2; } // 서리: 2초간 감속
  const a=Math.atan2(player.y-src.y, player.x-src.x);
  player.kbx=Math.cos(a)*140; player.kby=Math.sin(a)*140;
  burst(player.x, player.y-8, 8, ['#e84a4a','#ffcf9e'], 70, 0.45, 90);
  if(player.hp<=0){
    player.hp=0;
    player.dead=true; deathT=1.3; shake=8; sDie();
    burst(player.x, player.y-9, 22, [C.blue,C.steel,C.skin,'#e84a4a'], 95, 0.8, 130);
  }
}

function updPlayer(dt){
  if(player.dead) return;
  let ix=(k('arrowright')||k('d')?1:0)-(k('arrowleft')||k('a')?1:0);
  let iy=(k('arrowdown')||k('s')?1:0)-(k('arrowup')||k('w')?1:0);
  ix+=joyVec.x; iy+=joyVec.y;
  const len=Math.hypot(ix,iy);
  if(len>1){ ix/=len; iy/=len; }
  const attacking=player.atkT>0;

  // 대시 시작 (쿨다운 1초, 입력 방향 우선 / 없으면 바라보는 방향)
  if(player.dashCd>0) player.dashCd-=dt;
  if(wantDash && player.dashCd<=0 && player.dashT<=0){
    let dx=ix, dy=iy;
    const l=Math.hypot(dx,dy);
    if(l<0.2){ const v=DIRV[player.dir]; dx=v[0]; dy=v[1]; }
    else { dx/=l; dy/=l; }
    player.dashT=DASH_TIME; player.dashCd=DASH_CD;
    player.dashVx=dx*DASH_SPD; player.dashVy=dy*DASH_SPD;
    burst(player.x, player.y-2, 6, ['#c8e6ff','#e8f4ff'], 45, 0.3, 40);
    sDash();
  }
  wantDash=false;

  if(player.dashT>0){
    // 대시 중: 일반 이동 대신 대시 속도로 이동, 잔상 남기기
    player.dashT-=dt;
    player.x+=player.dashVx*dt; player.y+=player.dashVy*dt;
    player.mvx=player.dashVx*0.3; player.mvy=player.dashVy*0.3;
    ghosts.push({x:player.x, y:player.y, t:0.16, max:0.16});
    if(player.dashT<=0) player.dashGrace=DASH_GRACE;
    player.moving=true; player.animT+=dt;
  } else {
    // 일반 이동: 빙판 위에서는 관성이 생겨 미끄러진다
    if(player.slowT>0) player.slowT-=dt;
    const spd=P_SPEED*(attacking?0.4:1)*(player.slowT>0?0.7:1);
    const ice=onIceAt(player.x, player.y);
    const f = ice ? Math.min(1, 4.2*dt) : 1;
    player.mvx+=(ix*spd-player.mvx)*f;
    player.mvy+=(iy*spd-player.mvy)*f;
    player.x+=player.mvx*dt; player.y+=player.mvy*dt;
    player.moving = len>0.18 || Math.hypot(player.mvx,player.mvy)>10;
    if(player.moving) player.animT+=dt; else player.animT=0;
    if(len>0.18 && !attacking){
      if(Math.abs(ix)>Math.abs(iy)) player.dir=ix>0?'right':'left';
      else player.dir=iy>0?'down':'up';
    }
    // 서리 상태 표시 (눈송이 파티클)
    if(player.slowT>0 && Math.random()<dt*8)
      parts.push({x:player.x+rnd(-5,5), y:player.y-rnd(8,20), vx:rnd(-4,4), vy:8,
        g:0, life:0.4, max:0.4, col:'#d6f6fd', s:1});
  }
  if(player.dashGrace>0) player.dashGrace-=dt;

  // 넉백 감쇠 (빙판에선 더 오래 미끄러짐)
  player.x+=player.kbx*dt; player.y+=player.kby*dt;
  const fr = onIceAt(player.x,player.y) ? 0.08 : 0.0008;
  const d=Math.pow(fr,dt); player.kbx*=d; player.kby*=d;
  player.x=clamp(player.x,BX0,BX1); player.y=clamp(player.y,BY0,BY1);

  if(player.inv>0) player.inv-=dt;
  if(player.atkCd>0) player.atkCd-=dt;

  // 공격 판정
  if(player.atkT>0){
    player.atkT-=dt;
    const p=1-Math.max(0,player.atkT)/ATK_TIME;
    if(p>0.15 && p<0.85){
      const hb=swingRect();
      for(const m of mobs){
        if(m.spawnT>0 || m.deadFlag || m.fusing || m.lastSwing===player.swingId) continue;
        if(overlap(hb, mobRect(m))){ m.lastSwing=player.swingId; hitMob(m); }
      }
      // 검으로 투사체 쳐내기
      for(const sh of shots){
        if(sh.dead) continue;
        if(overlap(hb, {x:sh.x-2, y:sh.y-2, w:4, h:4})){
          sh.dead=true; sPop(); hitstop=Math.max(hitstop,0.03);
          burst(sh.x, sh.y, 5, [sh.lite||'#b0d8ff','#ffffff'], 55, 0.3, 0);
        }
      }
    }
  }
  if(k(' ')||k('z')||k('j')||touchAtk) tryAttack();

  // 접촉 피해 (대시 중과 직후 그레이스 동안은 몸통 통과)
  if(player.inv<=0 && player.dashT<=0 && player.dashGrace<=0){
    const prc={x:player.x-4, y:player.y-12, w:8, h:12};
    for(const m of mobs){
      if(m.spawnT>0 || m.deadFlag || m.fusing) continue;
      if(overlap(prc, mobRect(m))){ hurtPlayer(m); break; }
    }
  }

  // 지형 위험 (대시 중과 직후 그레이스 동안은 스치듯 통과 가능)
  if(state==='play' && player.dashT<=0 && player.dashGrace<=0 && !player.dead){
    const prc2={x:player.x-4, y:player.y-12, w:8, h:12};
    for(const o of obstacles){
      if(o.t<0.4) continue; // 생성 연출 중엔 무해
      if(o.kind==='cactus'){
        if(player.inv<=0 && overlap(prc2, obstRect(o,0))) hurtPlayer(o);
      } else if(o.kind==='lava'){
        if(ptIn(obstRect(o,-3), player.x, player.y)){
          // 사출은 무적시간과 무관하게 항상 (용암 안에 서 있는 상태 방지)
          const r=obstRect(o,0);
          const dl=player.x-r.x, dr=(r.x+r.w)-player.x, du=player.y-r.y, dd=(r.y+r.h)-player.y;
          const mn=Math.min(dl,dr,du,dd);
          let ex=0, ey=0;
          if(mn===dl){ player.x=r.x-7; ex=-1; }
          else if(mn===dr){ player.x=r.x+r.w+7; ex=1; }
          else if(mn===du){ player.y=r.y-7; ey=-1; }
          else { player.y=r.y+r.h+7; ey=1; }
          player.x=clamp(player.x,BX0,BX1); player.y=clamp(player.y,BY0,BY1);
          player.kbx=ex*190; player.kby=ey*190;
          burst(player.x, player.y-4, 8, ['#ff7b2e','#ffd23e'], 60, 0.4, 80);
          if(player.inv<=0) hurtPlayer({x:o.x,y:o.y}, 2);
          break;
        }
      }
    }
  }
}

function drawSword(){
  if(player.atkT<=0) return;
  const p=1-Math.max(0,player.atkT)/ATK_TIME;
  const base={right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2}[player.dir];
  const start=base-1.15, end=base+1.15;
  const ease=p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
  const A=start+(end-start)*ease;
  const hx=player.x, hy=player.y-9;
  // 궤적 잔상 (3겹 호)
  for(let i=0;i<=7;i++){
    const ta=start+(A-start)*(i/7);
    ctx.fillStyle='rgba(255,255,255,'+(0.08+0.40*(i/7))+')';
    ctx.fillRect(Math.round(hx+Math.cos(ta)*16)-1, Math.round(hy+Math.sin(ta)*16)-1, 2,2);
    ctx.fillRect(Math.round(hx+Math.cos(ta)*12)-1, Math.round(hy+Math.sin(ta)*12)-1, 2,2);
    ctx.fillRect(Math.round(hx+Math.cos(ta)*8)-1,  Math.round(hy+Math.sin(ta)*8)-1,  2,2);
  }
  // 검 본체 (손잡이 → 가드 → 긴 칼날 → 검 끝)
  for(let i=2;i<=16;i++){
    let col=C.steelL, s=3;
    if(i<=3){ col=C.brown; s=2; }
    else if(i<=5){ col=C.gold; s=2; }
    else if(i>=15){ col=C.white; s=2; }
    pr(hx+Math.cos(A)*i-1, hy+Math.sin(A)*i-1, s, s, col);
  }
  // 십자 가드
  const gpx=Math.cos(A+Math.PI/2), gpy=Math.sin(A+Math.PI/2);
  pr(hx+Math.cos(A)*5+gpx*2-1, hy+Math.sin(A)*5+gpy*2-1, 2,2, C.gold);
  pr(hx+Math.cos(A)*5-gpx*2-1, hy+Math.sin(A)*5-gpy*2-1, 2,2, C.gold);
  flushSprite(false);
}

function drawPlayer(){
  if(player.dead) return;
  const blink = player.inv>0 && (Math.floor(gameT*16)%2===0);
  shadow(player.x, player.y, 11);
  if(blink) return;

  const fx=Math.round(player.x), fy=Math.round(player.y);
  const frame=player.moving ? Math.floor(player.animT*8)%4 : 0;
  const legF=[0,1,0,2][frame];
  const bob = legF ? -1 : 0;
  const dv=DIRV[player.dir];
  const lunge = player.atkT>0 ? 2 : 0;
  const ox=dv[0]*lunge, oy=dv[1]*lunge;
  const x=fx+ox, yb=fy+Math.round(oy*0.5);

  if(player.dir==='up') drawSword();

  // 다리 + 부츠
  const lUp = legF===1?1:0, rUp = legF===2?1:0;
  pr(x-4, yb-5-lUp, 3, 3, C.pants);
  pr(x-4, yb-2-lUp, 4, 2, C.brown);
  pr(x+1, yb-5-rUp, 3, 3, C.pants);
  pr(x,   yb-2-rUp, 4, 2, C.brown);
  // 몸통
  pr(x-5, yb-13+bob, 10, 8, C.blue);
  pr(x-4, yb-12+bob, 8, 3, C.steel);
  pr(x-4, yb-12+bob, 8, 1, C.steelL);
  pr(x-5, yb-6+bob, 10, 1, C.brownD);
  pr(x-1, yb-6+bob, 2, 1, C.gold);
  // 팔 (걸을 때 앞뒤로 흔들림)
  const aoff = legF===1?1 : legF===2?-1 : 0;
  pr(x-7, yb-12+bob+aoff, 2, 4, C.blueD); pr(x-7, yb-8+bob+aoff, 2, 2, C.skin);
  pr(x+5, yb-12+bob-aoff, 2, 4, C.blueD); pr(x+5, yb-8+bob-aoff, 2, 2, C.skin);
  // 머리
  if(player.dir==='up'){
    pr(x-4, yb-18+bob, 8, 5, C.steel);
    pr(x-4, yb-16+bob, 8, 1, C.steelL);
  } else {
    pr(x-4, yb-18+bob, 8, 5, C.skin);
  }
  // 투구
  pr(x-4, yb-23+bob, 8, 2, C.steel);
  pr(x-5, yb-21+bob, 10, 3, C.steel);
  pr(x-5, yb-19+bob, 10, 1, C.steelL);
  // 깃털 장식
  pr(x-1, yb-26+bob, 2, 3, C.red);
  pr(x-1, yb-27+bob, 2, 1, '#ff8f8f');
  flushSprite(false);

  // 눈 (외곽선 없이 위에 얹기)
  if(player.dir!=='up'){
    ctx.fillStyle='#26283a';
    if(player.dir==='down'){ ctx.fillRect(x-3,yb-17+bob,1,2); ctx.fillRect(x+2,yb-17+bob,1,2); }
    else if(player.dir==='left'){ ctx.fillRect(x-4,yb-17+bob,1,2); ctx.fillRect(x+0,yb-17+bob,1,2); }
    else { ctx.fillRect(x-1,yb-17+bob,1,2); ctx.fillRect(x+3,yb-17+bob,1,2); }
  }
  // 위를 볼 때는 검이 몸 뒤에(이미 그림), 그 외에는 몸 앞에 그린다
  if(player.dir!=='up') drawSword();
}

/* ==========================================================
   몬스터
   ========================================================== */
function mobRect(m){
  if(m.type.kind==='bat') return {x:m.x-4, y:m.y-13, w:8, h:9};
  return {x:m.x-5, y:m.y-8, w:10, h:8};
}

function spawnMob(typeName){
  const type=MOB_TYPES[typeName];
  let x,y;
  for(let i=0;i<12;i++){
    const edge=(Math.random()*4)|0;
    if(edge===0){ x=rnd(BX0,BX1); y=BY0+rnd(0,8); }
    else if(edge===1){ x=rnd(BX0,BX1); y=BY1-rnd(0,8); }
    else if(edge===2){ x=BX0+rnd(0,8); y=rnd(BY0,BY1); }
    else { x=BX1-rnd(0,8); y=rnd(BY0,BY1); }
    if(Math.hypot(x-player.x, y-player.y)>55) break;
  }
  mobs.push({
    type, hp:type.hp + (type.kind==='slime' ? Math.min(2,ngPlus) : 0),
    x, y, z:0, t:rnd(0,3),
    spdMul:1 + stageIdx*0.05 + ngPlus*0.1,
    phase:'rest', pt:rnd(0.2,0.7), vx:0, vy:0,
    kbx:0, kby:0, flash:0, spawnT:0.6, lastSwing:-1,
    squishW:1, squishH:1, flap:0, spit:rnd(1.2,2.2), kbRes:0, hitRecent:0, hazCd:0
  });
}

function hitMob(m){
  if(m.fusing || m.deadFlag) return;
  m.hp--; m.flash=0.12; sHit();
  hitstop=Math.max(hitstop, 0.04);
  // 연속으로 맞을수록 넉백 저항 증가 (첫 타는 시원하게, 꾹 누르기 스턴락은 방지)
  if(m.hitRecent>0) m.kbRes=Math.min(m.kbRes+1, 4);
  else m.kbRes=0;
  m.hitRecent=0.9;
  const kb=115*(m.type.kbMul||1)/(1+m.kbRes*1.1);
  const a=Math.atan2(m.y-player.y, m.x-player.x);
  m.kbx+=Math.cos(a)*kb; m.kby+=Math.sin(a)*kb;
  burst(m.x, m.y-6, 5, ['#ffffff', m.type.lite], 60, 0.3, 0);
  if(m.hp<=0){
    hitstop=Math.max(hitstop, 0.07);
    killMob(m, 1, false);
  }
}

/* 처치 공통 처리 — mul: 점수 배율(지형 킬 0.5), terrain: 지형에 의한 죽음 */
function killMob(m, mul, terrain){
  m.hp=0;
  const sc=Math.max(1, Math.round(m.type.score*(mul===undefined?1:mul)));
  if(state==='play'){ score+=sc; kills++; }
  pops.push({x:m.x, y:m.y-12, txt:'+'+sc, t:0.8, max:0.8, col: terrain?'#c8cede':'#ffd23e'});
  if(m.type.bomb && !terrain){
    // 폭탄 슬라임: 즉사 대신 기폭 (1.2초 후 폭발, 지형 킬은 그냥 소멸)
    m.fusing=true; m.fuseT=1.2; m.kbx*=0.3; m.kby*=0.3;
    sTick();
    return;
  }
  m.deadFlag=true;
  shake=Math.max(shake,2); sKill();
  burst(m.x, m.y-5, 14, [m.type.body, m.type.lite, m.type.dark], 85, 0.55, 130);
}

function explode(x,y){
  shake=Math.max(shake,6); sBoom();
  hitstop=Math.max(hitstop,0.06);
  burst(x, y-4, 26, ['#ff7b2e','#ffd23e','#8a839c','#ffffff'], 120, 0.6, 90);
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2;
    parts.push({x:x+Math.cos(a)*4, y:y-4+Math.sin(a)*4, vx:Math.cos(a)*95, vy:Math.sin(a)*95,
      g:0, life:0.25, max:0.25, col:'#fff3c8', s:2});
  }
  // 플레이어 피해 (대시로도 못 피함 — 폭발은 광역, 일반 무적시간만 적용)
  if(state==='play' && !player.dead && player.inv<=0 &&
     Math.hypot(player.x-x, (player.y-6)-y)<26){
    hurtPlayer({x,y}, 1);
  }
  // 주변 몬스터 피해 (연쇄 폭발 가능)
  for(const o of mobs){
    if(o.deadFlag || o.fusing || o.spawnT>0) continue;
    if(Math.hypot(o.x-x, o.y-y)<30){
      o.hp-=2; o.flash=0.15;
      const a=Math.atan2(o.y-y, o.x-x);
      o.kbx+=Math.cos(a)*160*(o.type.kbMul||1); o.kby+=Math.sin(a)*160*(o.type.kbMul||1);
      if(o.hp<=0) killMob(o, 1, false);
    }
  }
}

/* 선인장에 부딪힌 몬스터 처리 (3회 사용 시 선인장 파괴) */
function cactusHitMob(m, o){
  m.hp--; m.flash=0.12; m.hazCd=0.6;
  const a=Math.atan2(m.y-o.y, m.x-o.x);
  m.kbx+=Math.cos(a)*110; m.kby+=Math.sin(a)*110;
  burst(m.x, m.y-5, 4, ['#ffffff','#7cc47e'], 50, 0.3, 0);
  sHit();
  o.uses--;
  if(o.uses<=0){
    burst(o.x, o.y-5, 10, ['#4e9c52','#7cc47e','#fff8d8'], 70, 0.5, 100);
    obstacles=obstacles.filter(q=>q!==o);
    sPop();
  }
  if(m.hp<=0) killMob(m, 0.5, true);
}

function updMob(m, dt){
  m.t+=dt;
  if(m.flash>0) m.flash-=dt;
  if(m.hitRecent>0) m.hitRecent-=dt;
  if(m.hazCd===undefined) m.hazCd=0;
  if(m.hazCd>0) m.hazCd-=dt;
  // 폭탄 슬라임 기폭 상태: 부풀며 깜빡이다 폭발
  if(m.fusing){
    m.fuseT-=dt;
    m.squishW=1+Math.sin(gameT*30)*0.15+(1.2-m.fuseT)*0.15;
    m.squishH=1-Math.sin(gameT*30)*0.1;
    if(m.fuseT<=0){ m.deadFlag=true; explode(m.x, m.y); }
    return;
  }
  if(m.spawnT>0){ m.spawnT-=dt; if(m.spawnT<=0) burst(m.x,m.y-4,6,['#ffffff','#dfe8ff'],45,0.3,0); return; }
  const mSpd=m.type.spd*(m.spdMul||1);

  if(m.type.kind==='slime'){
    m.pt-=dt;
    if(m.phase==='rest'){
      m.squishH=1+Math.sin(m.t*4)*0.06; m.squishW=1-Math.sin(m.t*4)*0.05; m.z=0;
      // 원거리형: 사거리 안이면 침 뱉기 준비
      if(m.type.ranged && state==='play' && !player.dead){
        m.spit-=dt;
        const dd=Math.hypot(player.x-m.x, player.y-m.y);
        if(m.spit<=0 && dd>42 && dd<165){ m.phase='spit'; m.pt=0.38; }
      }
      if(m.phase==='rest' && m.pt<=0){ m.phase='wind'; m.pt=0.13; }
    } else if(m.phase==='spit'){
      // 볼을 부풀리는 예비 동작 후 발사
      const q=1-Math.max(0,m.pt)/0.38;
      m.squishW=1+q*0.25; m.squishH=1-q*0.15;
      if(m.pt<=0){
        const a=Math.atan2((player.y-8)-(m.y-4), player.x-m.x);
        shots.push({x:m.x+Math.cos(a)*4, y:m.y-4+Math.sin(a)*4,
                    vx:Math.cos(a)*88, vy:Math.sin(a)*88, t:0,
                    col:m.type.body, lite:m.type.lite});
        m.spit=m.type.spitCd*rnd(0.8,1.25);
        m.phase='rest'; m.pt=m.type.rest*rnd(0.9,1.3);
        sSpit();
        burst(m.x, m.y-5, 3, [m.type.lite], 30, 0.2, 0);
      }
    } else if(m.phase==='wind'){
      m.squishH=0.68; m.squishW=1.28;
      if(m.pt<=0){
        m.phase='air'; m.pt=m.type.air;
        let ang;
        if(state==='play' && !player.dead){
          const dx=player.x-m.x, dy=player.y-m.y, dd=Math.hypot(dx,dy);
          const toward=Math.atan2(dy,dx);
          if(m.type.ranged){
            // 거리 유지: 가까우면 도망, 멀면 접근, 적당하면 옆으로 이동
            if(dd<65) ang=toward+Math.PI+rnd(-0.5,0.5);
            else if(dd>115) ang=toward+rnd(-0.4,0.4);
            else ang=toward+(Math.random()<0.5?1:-1)*(Math.PI/2)+rnd(-0.3,0.3);
          } else ang=toward+rnd(-0.35,0.35);
        }
        else ang=rnd(0,Math.PI*2);
        ang=avoidHazards(m, ang); // 위험 지형은 스스로 피해서 점프
        m.vx=Math.cos(ang)*mSpd; m.vy=Math.sin(ang)*mSpd;
      }
    } else if(m.phase==='air'){
      const pgr=1-m.pt/m.type.air;
      m.z=Math.sin(pgr*Math.PI)*6;
      m.squishH=1.18; m.squishW=0.85;
      m.x+=m.vx*dt; m.y+=m.vy*dt;
      if(m.pt<=0){
        m.phase='land'; m.pt=0.16; m.z=0;
        if(onIceAt(m.x,m.y)){ m.kbx+=m.vx*0.8; m.kby+=m.vy*0.8; } // 빙판 착지: 주르륵
        burst(m.x, m.y, 3, ['#6f9755','#c2a36b'], 30, 0.25, 60);
      }
    } else { // land
      m.squishH=0.62+ (1-m.pt/0.16)*0.38; m.squishW=1.32-(1-m.pt/0.16)*0.32;
      if(m.pt<=0){ m.phase='rest'; m.pt=m.type.rest*rnd(0.8,1.35); }
    }
  } else { // 박쥐
    m.flap=Math.floor(m.t*10)%2;
    if(state==='play' && !player.dead){
      const a=Math.atan2((player.y-9)-m.y, player.x-m.x);
      const s=Math.sin(m.t*4.5)*0.9;
      m.x+=(Math.cos(a)+Math.cos(a+Math.PI/2)*s*0.6)*mSpd*dt;
      m.y+=(Math.sin(a)+Math.sin(a+Math.PI/2)*s*0.6)*mSpd*dt;
    } else {
      m.x+=Math.cos(m.t*0.9)*mSpd*0.5*dt;
      m.y+=Math.sin(m.t*1.3)*mSpd*0.5*dt;
    }
  }
  // 넉백 (빙판에선 더 오래 미끄러짐)
  m.x+=m.kbx*dt; m.y+=m.kby*dt;
  const dcy=Math.pow(onIceAt(m.x,m.y)?0.25:0.003, dt); m.kbx*=dcy; m.kby*=dcy;
  m.x=clamp(m.x,BX0,BX1); m.y=clamp(m.y,BY0,BY1);

  // 지형 위험 판정 (박쥐는 비행이라 면제, 점프 중엔 통과)
  if(state==='play' && !m.deadFlag && m.type.kind!=='bat' && m.z<=2){
    const mr=mobRect(m);
    for(const o of obstacles){
      if(o.t<0.4) continue;
      if(o.kind==='cactus'){
        if(m.hazCd<=0 && overlap(mr, obstRect(o,0))){ cactusHitMob(m,o); break; }
      } else if(o.kind==='lava'){
        if(ptIn(obstRect(o,-3), m.x, m.y-2)){
          burst(m.x, m.y-2, 8, ['#ff7b2e','#3a1810', m.type.dark], 55, 0.4, 20);
          killMob(m, 0.5, true);
          break;
        }
      }
    }
  }
}

/* 점프 각도가 위험 지형을 향하면 좌우로 틀어 회피 (실패 시 원래 각도 유지 — 드물게 실수함) */
function avoidHazards(m, ang){
  if(!obstacles.length || m.type.kind==='bat') return ang;
  const hop=m.type.spd*(m.spdMul||1)*m.type.air;
  const tries=[0, 0.55, -0.55, 1.1, -1.1, 1.7, -1.7];
  for(const off of tries){
    const a=ang+off;
    const ex=m.x+Math.cos(a)*hop, ey=m.y+Math.sin(a)*hop;
    const mx=(m.x+ex)/2, my=(m.y+ey)/2;
    if(!hazardAtPoint(ex,ey,7) && !hazardAtPoint(mx,my,7)) return a;
  }
  return ang;
}

function drawMob(m){
  const gy=Math.round(m.y);
  if(m.spawnT>0){
    // 등장 예고: 깜빡이는 고리
    if(Math.floor(m.spawnT*12)%2===0){
      ctx.fillStyle='rgba(255,210,62,0.85)';
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2 + m.spawnT*5;
        ctx.fillRect(Math.round(m.x+Math.cos(a)*7)-1, Math.round(gy-4+Math.sin(a)*4)-1, 2,2);
      }
    }
    return;
  }
  const flash=m.flash>0 || (m.fusing && Math.floor(gameT*14)%2===0);

  if(m.type.kind==='slime'){
    const w=Math.max(6,Math.round(12*m.squishW));
    const h=Math.max(4,Math.round(9*m.squishH));
    const x=Math.round(m.x), y=Math.round(m.y-m.z);
    shadow(m.x, m.y, Math.max(6, 10-(m.z|0)));
    pr(x-(w>>1)+1, y-h,   w-2, 2, m.type.lite);
    pr(x-(w>>1)+1, y-h+1, w-2, h-2, m.type.body);
    pr(x-(w>>1),   y-h+2, w,   h-4, m.type.body);
    pr(x-(w>>1),   y-2,   w,   2, m.type.dark);
    flushSprite(flash);
    if(!flash){
      const ex=Math.sign(player.x-m.x)||1;
      ctx.fillStyle='#ffffff';
      ctx.fillRect(x-3+ex, y-h+2, 2,2); ctx.fillRect(x+1+ex, y-h+2, 2,2);
      ctx.fillStyle='#173322';
      ctx.fillRect(x-3+ex+(ex>0?1:0), y-h+3, 1,1); ctx.fillRect(x+1+ex+(ex>0?1:0), y-h+3, 1,1);
      ctx.fillStyle=m.type.dark;
      if(m.phase==='spit') ctx.fillRect(x-2+ex, y-h+4, 4,2);
      else ctx.fillRect(x-1+ex, y-h+5, 2,1);
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.fillRect(x-(w>>1)+2, y-h+1, 2,1);
      if(m.type.bomb){ // 도화선 불꽃
        ctx.fillStyle='#3a3540'; ctx.fillRect(x, y-h-2, 1,2);
        ctx.fillStyle=Math.floor(gameT*10)%2?'#ffd23e':'#ff7b2e';
        ctx.fillRect(x, y-h-3, 1,1);
      }
    }
  } else {
    // 박쥐
    const fy=Math.round(m.y-11-Math.sin(m.t*6)*1.5);
    const x=Math.round(m.x);
    shadow(m.x, m.y, 7);
    if(m.flap===0){
      pr(x-8, fy-4, 5, 2, m.type.dark); pr(x+3, fy-4, 5, 2, m.type.dark);
      pr(x-7, fy-5, 3, 1, m.type.body); pr(x+4, fy-5, 3, 1, m.type.body);
    } else {
      pr(x-8, fy+0, 5, 2, m.type.dark); pr(x+3, fy+0, 5, 2, m.type.dark);
      pr(x-7, fy-1, 3, 1, m.type.body); pr(x+4, fy-1, 3, 1, m.type.body);
    }
    pr(x-3, fy-3, 6, 5, m.type.body);
    pr(x-3, fy-4, 1, 1, m.type.body); pr(x+2, fy-4, 1, 1, m.type.body);
    flushSprite(flash);
    if(!flash){
      ctx.fillStyle='#ffe97a';
      ctx.fillRect(x-2, fy-2, 1,1); ctx.fillRect(x+1, fy-2, 1,1);
      ctx.fillStyle='#ffffff';
      ctx.fillRect(x-1, fy+1, 1,1); ctx.fillRect(x+0, fy+1, 1,1);
    }
  }
}

/* ---------- 파티클 / 점수 팝업 ---------- */
function burst(x,y,n,cols,spd,life,grav){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), v=rnd(spd*0.3,spd);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rnd(0,spd*0.4),
      g:grav, life:rnd(life*0.6,life), max:life,
      col:cols[(Math.random()*cols.length)|0], s:Math.random()<0.3?2:1});
  }
}
function updParts(dt){
  for(const p of parts){ p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){ p.y-=14*dt; p.t-=dt; }
  pops=pops.filter(p=>p.t>0);
  for(const g of ghosts) g.t-=dt;
  ghosts=ghosts.filter(g=>g.t>0);
}

/* ---------- 투사체 (파란 슬라임의 침) ---------- */
function updShots(dt){
  for(const s of shots){
    if(s.dead) continue;
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.t+=dt;
    if(Math.random()<0.35)
      parts.push({x:s.x,y:s.y,vx:rnd(-8,8),vy:rnd(-8,8),g:0,life:0.16,max:0.16,col:s.lite||'#b0d8ff',s:1});
    if(s.x<BX0-6||s.x>BX1+6||s.y<BY0-12||s.y>BY1+8){ s.dead=true; continue; }
    // 대시 중에도 투사체는 맞는다 (일반 피격 무적시간만 적용)
    if(state==='play' && !player.dead && player.inv<=0){
      const prc={x:player.x-4, y:player.y-12, w:8, h:12};
      if(overlap(prc, {x:s.x-2, y:s.y-2, w:4, h:4})){ s.dead=true; hurtPlayer(s); continue; }
    }
  }
  shots=shots.filter(s=>!s.dead);
}
function drawShots(){
  for(const s of shots){
    const x=Math.round(s.x), y=Math.round(s.y);
    ctx.fillStyle=C.out; ctx.fillRect(x-2,y-2,5,5);
    ctx.fillStyle=s.col||'#4a9df0'; ctx.fillRect(x-1,y-1,3,3);
    ctx.fillStyle=s.lite||'#d6ecff'; ctx.fillRect(x-1,y-1,1,1);
  }
}
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
  }
  ctx.globalAlpha=1;
  for(const p of pops){
    ctx.globalAlpha=clamp(p.t/p.max,0,1);
    drawText(p.txt, Math.round(p.x), Math.round(p.y)-5, 1, p.col, 'center');
  }
  ctx.globalAlpha=1;
}

/* ---------- 웨이브 ---------- */
function startWave(){
  wave++;
  banner={txt:'WAVE '+wave, t:1.5};
  clearObstacles(true);   // 기존 장애물 제거(파티클 연출)
  placeObstacles();       // 새 위치에 랜덤 배치
  const s=stageIdx, g=ngPlus, w=wave;
  const q=[];
  const add=(name,n)=>{ for(let i=0;i<Math.max(0,n|0);i++) q.push(name); };
  add('green', Math.min(10, 2+w+s+g));
  if(w>=2 || s>=1 || g>0) add('bat', Math.min(6, Math.floor((w+s)/2)+g));
  if(w>=3 || s>=1 || g>0) add('red', Math.min(6, w-2+s+g));
  if(s>=1 || g>0) add('sand',  Math.min(4, (s===1 ? w-1 : (s>1?2:1))+g));
  if(s>=2 || g>0) add('frost', Math.min(4, (s===2 ? w-1 : (s>2?2:1))+g));
  if(s>=3 || g>0) add('bomb',  Math.min(4, (s===3 ? w-1 : 1)+g));
  if(w===WAVES_PER_STAGE) add('gold', 1+Math.floor(s/2)+g);
  else if(w>=4 && s>=2) add('gold', 1);
  for(let i=q.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const tmp=q[i]; q[i]=q[j]; q[j]=tmp; }
  spawnQueue=q; spawnT=0.4;
  if(wave>1 && player.hp<player.maxHp){
    player.hp++;
    pops.push({x:player.x, y:player.y-26, txt:'HP +1', t:0.9, max:0.9, col:'#ff8f8f'});
    sHeal();
  }
  sWave();
}

/* ---------- 스테이지 진행 ---------- */
function stageClear(){
  state='stagewait';
  const bonus=player.hp*40*(1+stageIdx+ngPlus*4);
  score+=bonus;
  best=Math.max(best,score);
  player.hp=player.maxHp;
  clearObstacles(true);
  shots=[];
  const nextIdx=(stageIdx+1)%STAGES.length;
  const nextLoop=stageIdx===STAGES.length-1 ? ngPlus+2 : ngPlus+1;
  stgTitle.textContent='STAGE '+(stageIdx+1)+' 클리어!';
  stgBonus.textContent='+'+bonus;
  stgNext.textContent=(stageIdx===STAGES.length-1 ? nextLoop+'회차 ' : '')+STAGES[nextIdx].name;
  ovStage.classList.remove('hidden');
  sWave(); setTimeout(()=>sHeal(),350);
}
function advanceStage(){
  if(state!=='stagewait') return;
  stageIdx++;
  if(stageIdx>=STAGES.length){ stageIdx=0; ngPlus++; }
  buildTerrain(stageIdx);
  player.x=W/2; player.y=H/2+18; player.dir='down';
  player.kbx=0; player.kby=0; player.mvx=0; player.mvy=0;
  wave=0; nextWaveT=0.5; banner=null;
  ovStage.classList.add('hidden');
  state='play';
}

/* ---------- HUD / 배너 ---------- */
function drawHUD(){
  for(let i=0;i<player.maxHp;i++) drawHeart(5+i*10, 4, i<player.hp);
  drawText('SCORE '+String(score).padStart(5,'0'), W-5, 4, 1, '#ffd23e', 'right');
  const lp = ngPlus>0 ? 'X'+(ngPlus+1)+' ' : '';
  drawText(lp+'STAGE '+(stageIdx+1)+'-'+Math.max(1,wave), W/2, 4, 1, '#cfe3ff', 'center');
}
function drawBanner(){
  if(!banner) return;
  if(state!=='pause' && state!=='stagewait') banner.t-=lastDt;
  if(banner.t<=0){ banner=null; return; }
  const a=clamp(banner.t<0.3 ? banner.t/0.3 : (1.5-banner.t)<0.25 ? (1.5-banner.t)/0.25 : 1, 0, 1);
  ctx.globalAlpha=a;
  drawText(banner.txt, W/2, 56, 2, '#ffd23e', 'center');
  ctx.globalAlpha=1;
}

/* ---------- 게임 흐름 ---------- */
function resetWorld(){
  mobs=[]; parts=[]; pops=[]; spawnQueue=[]; shots=[]; ghosts=[];
  hitstop=0; wantDash=false;
  stageIdx=0; ngPlus=0; clearObstacles(false);
  buildTerrain(0);
  player.x=W/2; player.y=H/2+18; player.dir='down';
  player.hp=player.maxHp; player.inv=0; player.atkT=0; player.atkCd=0;
  player.kbx=0; player.kby=0; player.dead=false; player.moving=false;
  player.dashT=0; player.dashCd=0; player.dashGrace=0;
  player.mvx=0; player.mvy=0; player.slowT=0;
  score=0; kills=0; wave=0; banner=null; shake=0; nextWaveT=0.4; deathT=0;
}
function startGame(){
  initAudio();
  resetWorld();
  state='play';
  ovStart.classList.add('hidden');
  ovOver.classList.add('hidden');
  ovPause.classList.add('hidden');
  ovStage.classList.add('hidden');
}
function gameOver(){
  state='over';
  best=Math.max(best,score);
  stScore.textContent=score;
  stBest.textContent=best;
  stKills.textContent=kills;
  stWave.textContent=(ngPlus>0?(ngPlus+1)+'회차 ':'')+(stageIdx+1)+'-'+Math.max(1,wave);
  ovOver.classList.remove('hidden');
}
function setPause(on){
  if(on && state==='play'){ state='pause'; ovPause.classList.remove('hidden'); }
  else if(!on && state==='pause'){ state='play'; ovPause.classList.add('hidden'); }
}
function toggleMute(){
  muted=!muted;
  muteBtn.textContent = muted ? '소리 끔' : '소리 켬';
}

/* 시작 화면용 데모 슬라임 */
function spawnDemo(){
  for(let i=0;i<4;i++){
    spawnMob('green');
    const m=mobs[mobs.length-1];
    m.x=rnd(BX0+30,BX1-30); m.y=rnd(BY0+20,BY1-15); m.spawnT=0;
  }
}

/* ---------- 메인 루프 ---------- */
let lastT=performance.now(), lastDt=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>0.05) dt=0.05;
  lastDt=dt;
  if(state==='pause' || state==='stagewait'){ render(); return; }
  // 히트스톱: 타격 순간 아주 짧게 세계를 멈춰 타격감을 준다
  if(hitstop>0){ hitstop-=dt; render(); return; }
  gameT+=dt;

  if(state==='play'){
    updPlayer(dt);
    // 스폰 처리 (동시 출현 상한: 넘치면 대기열에서 순서를 기다림)
    if(spawnQueue.length>0){
      if(mobs.length<MOB_CAP){
        spawnT-=dt;
        if(spawnT<=0){
          spawnT=Math.max(0.3, 1.05-wave*0.05-stageIdx*0.07-ngPlus*0.06);
          spawnMob(spawnQueue.pop());
        }
      }
    } else if(mobs.length===0 && !player.dead){
      if(nextWaveT<0) nextWaveT=1.5;
      nextWaveT-=dt;
      if(nextWaveT<=0){
        nextWaveT=-1;
        if(wave>=WAVES_PER_STAGE) stageClear();
        else startWave();
      }
    }
    if(player.dead){
      deathT-=dt;
      if(deathT<=0) gameOver();
    }
  }
  for(const m of mobs) updMob(m,dt);
  mobs=mobs.filter(m=>!m.deadFlag);
  updObstacles(dt);
  updShots(dt);
  updParts(dt);
  if(shake>0) shake=Math.max(0,shake-dt*14);

  render();
}

function render(){
  ctx.save();
  if(shake>0.1) ctx.translate(Math.round(rnd(-shake,shake)), Math.round(rnd(-shake,shake)));
  ctx.drawImage(bg,0,0);
  drawGroundObstacles();

  // 대시 잔상
  for(const g of ghosts){
    ctx.globalAlpha=0.38*(g.t/g.max);
    ctx.fillStyle='#aee0ff';
    const gx=Math.round(g.x), gy=Math.round(g.y);
    ctx.fillRect(gx-5,gy-13,10,11);
    ctx.fillRect(gx-4,gy-23,8,10);
    ctx.globalAlpha=1;
  }

  // y좌표(발 위치) 기준으로 정렬해서 그리기 (선인장 포함)
  const list=[];
  for(const m of mobs) list.push({y:m.y, f:drawMob, a:m});
  for(const o of obstacles) if(o.kind==='cactus') list.push({y:o.y, f:drawCactus, a:o});
  if(!player.dead) list.push({y:player.y+0.01, f:drawPlayer, a:null});
  list.sort((a,b)=>a.y-b.y);
  for(const e of list) e.a===null ? drawPlayer() : e.f(e.a);

  drawShots();
  // 대시 쿨다운 바 (재충전 중일 때만 발밑에 표시)
  if(!player.dead && player.dashCd>0 && state==='play'){
    const px_=Math.round(player.x), py_=Math.round(player.y);
    ctx.fillStyle='rgba(18,24,32,0.6)';
    ctx.fillRect(px_-5, py_+3, 10, 2);
    ctx.fillStyle='#7dd3ff';
    ctx.fillRect(px_-5, py_+3, Math.round(10*clamp(1-player.dashCd/DASH_CD,0,1)), 2);
  }

  drawParts();
  ctx.restore();

  drawHUD();
  drawBanner();
}

/* ---------- 캔버스 크기 맞추기 ---------- */
function fit(){
  let sc=Math.min((innerWidth-20)/W, (innerHeight-20)/H);
  if(sc>=2) sc=Math.floor(sc);
  if(sc<=0) sc=1;
  cv.style.width=(W*sc)+'px';
  cv.style.height=(H*sc)+'px';
}
window.addEventListener('resize', fit);

/* ---------- 터치 컨트롤 ---------- */
const touchUI=document.getElementById('touch');
const joy=document.getElementById('joy'), knob=document.getElementById('knob');
const atkBtn=document.getElementById('atkBtn');
if('ontouchstart' in window || navigator.maxTouchPoints>0){
  touchUI.classList.remove('hidden');
  /* 조이스틱은 자신을 처음 누른 손가락(identifier)만 추적한다.
     e.touches[0]은 화면 전체 기준 첫 터치라서, 공격/대시 버튼을 먼저 누른 채
     조이스틱을 잡으면 다른 손가락 좌표를 읽는 버그가 있었음.
     (identifier는 0일 수 있으므로 null 비교로만 판별) */
  let joyId=null;
  const findTouch=(list,id)=>{ for(let i=0;i<list.length;i++) if(list[i].identifier===id) return list[i]; return null; };
  const moveJoy=(t)=>{
    const r=joy.getBoundingClientRect();
    let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
    const len=Math.hypot(dx,dy), max=32;
    if(len>max){ dx=dx/len*max; dy=dy/len*max; }
    joyVec={x:dx/max, y:dy/max};
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
  };
  const resetJoy=()=>{ joyId=null; joyVec={x:0,y:0}; knob.style.transform='translate(0,0)'; };
  joy.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(joyId===null && e.changedTouches.length>0) joyId=e.changedTouches[0].identifier;
    const t=findTouch(e.changedTouches, joyId);
    if(t) moveJoy(t); // 추적 중이 아닌 두 번째 손가락은 무시
  },{passive:false});
  joy.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(joyId===null) return;
    const t=findTouch(e.changedTouches, joyId);
    if(t) moveJoy(t);
  },{passive:false});
  const endJoy=(e)=>{
    e.preventDefault();
    if(joyId!==null && findTouch(e.changedTouches, joyId)) resetJoy();
  };
  joy.addEventListener('touchend',endJoy,{passive:false});
  joy.addEventListener('touchcancel',endJoy,{passive:false}); // OS가 터치를 끊어도 스틱이 고착되지 않게
  atkBtn.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); touchAtk=true; },{passive:false});
  atkBtn.addEventListener('touchend',e=>{ e.preventDefault(); touchAtk=false; },{passive:false});
  const dashBtn=document.getElementById('dashBtn');
  dashBtn.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); wantDash=true; },{passive:false});
  dashBtn.addEventListener('touchend',e=>{ e.preventDefault(); },{passive:false});
}

/* ---------- UI 연결 ---------- */
const ovStart=document.getElementById('ovStart');
const ovOver=document.getElementById('ovOver');
const ovPause=document.getElementById('ovPause');
const ovStage=document.getElementById('ovStage');
const stgTitle=document.getElementById('stgTitle');
const stgBonus=document.getElementById('stgBonus');
const stgNext=document.getElementById('stgNext');
const stScore=document.getElementById('stScore');
const stBest=document.getElementById('stBest');
const stKills=document.getElementById('stKills');
const stWave=document.getElementById('stWave');
const muteBtn=document.getElementById('muteBtn');
document.getElementById('btnStart').addEventListener('click',startGame);
document.getElementById('btnRetry').addEventListener('click',startGame);
document.getElementById('btnResume').addEventListener('click',()=>setPause(false));
document.getElementById('btnStageNext').addEventListener('click',advanceStage);
muteBtn.addEventListener('click',()=>{ initAudio(); toggleMute(); });

/* ---------- 시작 ---------- */
fit();
spawnDemo();
requestAnimationFrame(loop);
</script>
